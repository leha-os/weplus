            <div class="bg-charcoal border-l-4 border-copper p-4 shadow-sm flex items-center justify-between text-white">
              <div>
                <span class="text-[10px] uppercase font-bold text-copper">Quyết định 06</span>
                <h4 class="text-sm font-medium mt-0.5">NEXT STEP</h4>
              </div>
              <p class="text-xs text-gray-400 text-right">Ấn định Owner + Deadline hoàn thiện Q4.</p>
            </div>
          </div>
        `
      },
      {
        id: 15,
        type: 'closing',
        content: `
          <div class="flex flex-col justify-center items-center h-full text-center">
            <h4 class="text-[11px] font-bold uppercase tracking-widest text-copper mb-4">Strategic Horizon</h4>
            
            <h1 class="font-cormorant text-5xl md:text-7xl font-light text-pure leading-tight mb-8">
              One System. <br>
              Multiple Capabilities. <br>
              <span class="italic text-copper">One Direction.</span>
            </h1>
            
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 w-full max-w-3xl border-t border-gray-700 pt-8 text-white">
              <div>
                <h4 class="font-cormorant text-2xl font-bold mb-1">CONNECT</h4>
                <p class="text-[10px] uppercase tracking-wider text-gray-400">Kết nối năng lực</p>
              </div>
              <div>
                <h4 class="font-cormorant text-2xl font-bold mb-1">COLLAB</h4>
                <p class="text-[10px] uppercase tracking-wider text-gray-400">Phối hợp nguồn lực</p>
              </div>
              <div>
                <h4 class="font-cormorant text-2xl font-bold mb-1">CREATE</h4>
                <p class="text-[10px] uppercase tracking-wider text-gray-400">Tạo thêm giá trị</p>
              </div>
              <div>
                <h4 class="font-cormorant text-2xl font-bold text-copper mb-1">GROW</h4>
                <p class="text-[10px] uppercase tracking-wider text-gray-400">Bứt phá cùng hệ sinh thái</p>
              </div>
            </div>
            
            <p class="text-sm font-light text-gray-400 mt-12 max-w-xl">
              "WePlus⁺ không phải một lớp vận hành để làm phức tạp thêm, mà là nền tảng để kết nối năng lực, cộng hưởng nguồn lực và chuyển hóa năng lực của Tgroup thành những giá trị lớn hơn."
            </p>
          </div>
        `
      }
    ];

    let currentSlide = 0;

    function renderSlide(index) {
      const slide = SLIDES[index];
      const container = document.getElementById('slideContent');
      document.getElementById('slideCounterLabel').innerText = `${String(index + 1).padStart(2, '0')}/${String(SLIDES.length).padStart(2, '0')}`;
      document.getElementById('slideIndicator').innerText = `${String(index + 1).padStart(2, '0')} / ${String(SLIDES.length).padStart(2, '0')}`;
      
      // Handle themeing
      if (slide.type === 'cover' || slide.type === 'closing') {
        container.className = 'slide-page rounded-xl p-8 sm:p-12 shadow-2xl relative min-h-[600px] flex flex-col justify-between overflow-hidden bg-charcoal text-pure border-0';
      } else {
        container.className = 'slide-page rounded-xl p-8 sm:p-12 shadow-xl relative min-h-[600px] flex flex-col justify-between overflow-hidden bg-pure text-ink border border-copper-light';
      }

      let html = '';

      if (slide.type === 'cover' || slide.type === 'closing') {
        html = slide.content;
      } else {
        // Standard Content Slide Header
        html = `
          <div class="flex items-center justify-between pb-4 border-b border-copper-light mb-8">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-widest text-copper block mb-1">${slide.subtitle}</span>
              <h2 class="font-cormorant text-3xl font-semibold text-ink">${slide.title}</h2>
            </div>
            <span class="text-cormorant text-4xl font-light text-copper-light italic">
              ${String(index).padStart(2, '0')}
            </span>
          </div>
          <div class="flex-grow flex flex-col justify-center">
            ${slide.content}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function initDeck() {
      renderSlide(currentSlide);
      const list = document.getElementById('drawerList');
      list.innerHTML = SLIDES.map((s, i) => `
        <button onclick="goToSlide(${i})" class="w-full text-left px-3 py-2 text-xs border-b border-gray-100 hover:bg-paper hover:text-copper-dark transition-colors flex items-center justify-between">
          <span class="truncate pr-2 ${i === 0 || i === SLIDES.length-1 ? 'font-bold' : ''}">
            ${i}. ${s.title || 'Overview / Cover'}
          </span>
        </button>
      `).join('');
    }

    function toggleDrawer() {
      document.getElementById('slideDrawer').classList.toggle('translate-x-full');
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
      toggleDrawer();
    }

    function prevSlide() {
      if (currentSlide > 0) { currentSlide--; renderSlide(currentSlide); }
    }

    function nextSlide() {
      if (currentSlide < SLIDES.length - 1) { currentSlide++; renderSlide(currentSlide); }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
    });

    window.onload = initDeck;
  </script>
</body>
</html>
