  <style>
    @font-face {
      font-family: "Optimistic";
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: local("Segoe UI"), local("Roboto"), local("Arial");
    }

    :root {
      --brand: #0f3a2e;
      --brand-2: #1a5f47;
      --brand-3: #257f60;
      --accent: #b8975a;
      --accent-light: #d4b678;
      --accent-soft: #f6f0e4;
      --accent-2: #e8dcc0;
      --ink: #1a1f1c;
      --muted: #616a64;
      --line: #e6e1d6;
      --bg: #f5f2eb;
      --hero-bg: radial-gradient(120% 120% at 20% 15%, #0d2c23 0%, #061611 60%, #020907 100%);
    }

    body {
      font-family: 'Optimistic', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(1200px circle at 10% 10%, rgba(184,151,90,0.12), transparent 55%),
        radial-gradient(1000px circle at 90% 90%, rgba(26,95,71,0.09), transparent 55%),
        radial-gradient(800px circle at 50% 50%, rgba(212,182,120,0.06), transparent 70%);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient background glowing orbs với ánh mạ vàng đồng */
    body::before, body::after {
      content: "";
      position: fixed;
      width: 850px;
      height: 850px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.45;
      filter: blur(130px);
    }
    body::before {
      background: radial-gradient(circle, rgba(184,151,90,0.35) 0%, rgba(212,182,120,0.12) 45%, transparent 70%);
      top: -200px;
      left: -200px;
    }
    body::after {
      background: radial-gradient(circle, rgba(26,95,71,0.3) 0%, rgba(15,58,46,0.1) 45%, transparent 70%);
      bottom: -200px;
      right: -200px;
    }

    /* Lớp hoa văn art hình học luxury mờ ảo nền trang */
    .bg-art-pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.035;
      background-image: radial-gradient(#b8975a 1px, transparent 1px), radial-gradient(#1a5f47 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }

    /* Màn hình Intro nguyên bản chuẩn Handbook v1 */
    #hero {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: radial-gradient(120% 120% at 20% 20%, #0c2e24 0%, #071a14 55%, #040f0c 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), visibility 1s, transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #hero.out {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.05);
      pointer-events: none;
    }
    #hero::before {
      content: "";
      pointer-events: none;
      position: absolute;
      width: 180vmax;
      height: 180vmax;
      left: 50%;
      top: 50%;
      margin: -90vmax 0 0 -90vmax;
      background: conic-gradient(from 0deg, transparent 0, rgba(184, 151, 90, 0.16) 10%, transparent 24%, rgba(20, 80, 59, 0.52) 48%, rgba(184, 151, 90, 0.12) 72%, transparent 88%);
      animation: heroSpin 75s linear infinite;
      filter: blur(1.5px);
    }
    #hero::after {
      content: "";
      position: absolute;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(184, 151, 90, 0.22) 0%, rgba(20, 80, 59, 0.15) 45%, transparent 70%);
      pointer-events: none;
      filter: blur(80px);
    }
    @keyframes heroSpin { to { transform: rotate(360deg); } }

    .hero-w {
      height: 0;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
      opacity: 0;
      animation: logoGrow 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
    }
    @keyframes logoGrow {
      0% { height: 0; opacity: 0; transform: scale(0.2) translateY(50px); }
      100% { height: 145px; opacity: 1; transform: scale(1) translateY(0); }
    }
    .hero-line {
      height: 1px;
      width: 0;
      margin: 22px auto;
      background: linear-gradient(90deg, transparent, #b8975a 25%, #d4b678 50%, #b8975a 75%, transparent);
      animation: lineExpand 1.2s 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 0 18px rgba(184,151,90,0.5);
    }
    @keyframes lineExpand { to { width: 170px; } }

    .hero-sub {
      opacity: 0;
      margin: 8px 0 28px;
      transform: translateY(12px);
      animation: heroFadeUp 0.8s 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .hero-btn {
      opacity: 0;
      border: 1px solid #b8975a;
      background: linear-gradient(135deg, rgba(20, 80, 59, 0.55), rgba(184, 151, 90, 0.22));
      color: #ffffff;
      padding: 13px 36px;
      letter-spacing: 0.15em;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 11.5px;
      font-weight: 700;
      border-radius: 99px;
      transform: translateY(12px);
      animation: heroFadeUp 0.8s 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards, heroPulse 3.5s 2.5s infinite;
      transition: all 0.35s ease;
      backdrop-filter: blur(8px);
    }
    .hero-btn:hover {
      background: #b8975a;
      color: #08231c;
      box-shadow: 0 0 28px rgba(184, 151, 90, 0.55);
      transform: translateY(-2px) scale(1.02);
    }
    @keyframes heroFadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(184,151,90,0.35); }
      50% { box-shadow: 0 0 0 14px rgba(184,151,90,0); }
    }

    /* Gradient vàng đồng ánh kim dùng chung */
    .gold-gradient-text {
      background: linear-gradient(135deg, #fcedc7 0%, #d8bc80 30%, #b8975a 70%, #906e32 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(184,151,90,0.3);
    }

    /* Tiêu đề chính ánh kim vàng đồng mạ nhẹ */
    .gold-gradient-title {
      background: linear-gradient(135deg, #0a251d 0%, #4a3818 30%, #a88849 65%, #c9aa69 85%, #573e16 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 1px 1.5px rgba(184, 151, 90, 0.22));
    }

    /* Slide nội dung với kính mờ và viền mạ kim */
    .slide-page {
      transition: all 0.38s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .slide-light-glass {
      background: rgba(255, 255, 255, 0.88) !important;
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
      border: 1.5px solid rgba(184, 151, 90, 0.48) !important;
      box-shadow: 
        0 20px 50px -10px rgba(15, 58, 46, 0.09),
        0 0 0 1px rgba(212, 182, 120, 0.35),
        inset 0 1px 2px rgba(255, 255, 255, 0.95),
        inset 0 0 24px rgba(184, 151, 90, 0.08);
      animation: rimGlint 7s ease-in-out infinite;
    }

    .slide-dark-metal {
      background: radial-gradient(120% 120% at 20% 15%, #0f3025 0%, #081d16 55%, #030d0a 100%) !important;
      border: 1.5px solid rgba(212, 182, 120, 0.55) !important;
      box-shadow: 
        0 30px 70px -15px rgba(2, 8, 6, 0.85),
        0 0 0 1px rgba(184, 151, 90, 0.35),
        inset 0 1px 2px rgba(252, 237, 199, 0.45),
        inset 0 0 45px rgba(184, 151, 90, 0.12);
      position: relative;
      animation: rimGlintDark 7s ease-in-out infinite;
    }

    .slide-page::after {
      content: "";
      position: absolute;
      top: -120%;
      left: -120%;
      width: 340%;
      height: 340%;
      pointer-events: none;
      background: linear-gradient(
        115deg,
        transparent 0%,
        transparent 42%,
        rgba(212, 182, 120, 0.06) 47%,
        rgba(255, 240, 205, 0.32) 50%,
        rgba(184, 151, 90, 0.12) 53%,
        transparent 58%,
        transparent 100%
      );
      transform: rotate(26deg);
      animation: periodicLightSweep 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      z-index: 20;
    }

    @keyframes periodicLightSweep {
      0% { transform: translate(-100%, -100%) rotate(26deg); opacity: 0; }
      8% { opacity: 1; }
      32% { transform: translate(25%, 25%) rotate(26deg); opacity: 1; }
      42%, 100% { transform: translate(95%, 95%) rotate(26deg); opacity: 0; }
    }

    @keyframes rimGlint {
      0%, 100% {
        box-shadow: 0 20px 50px -10px rgba(15, 58, 46, 0.09), 0 0 0 1px rgba(212, 182, 120, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.95), inset 0 0 24px rgba(184, 151, 90, 0.08);
      }
      20% {
        box-shadow: 0 22px 55px -8px rgba(15, 58, 46, 0.14), 0 0 14px 2px rgba(212, 182, 120, 0.45), 0 0 0 1.5px rgba(212, 182, 120, 0.75), inset 0 1px 3px rgba(255, 255, 255, 1), inset 0 0 32px rgba(212, 182, 120, 0.16);
      }
      38% {
        box-shadow: 0 20px 50px -10px rgba(15, 58, 46, 0.09), 0 0 0 1px rgba(212, 182, 120, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.95), inset 0 0 24px rgba(184, 151, 90, 0.08);
      }
    }

    @keyframes rimGlintDark {
      0%, 100% {
        box-shadow: 0 30px 70px -15px rgba(2, 8, 6, 0.85), 0 0 0 1px rgba(184, 151, 90, 0.35), inset 0 1px 2px rgba(252, 237, 199, 0.45), inset 0 0 45px rgba(184, 151, 90, 0.12);
      }
      20% {
        box-shadow: 0 35px 80px -10px rgba(2, 8, 6, 0.95), 0 0 18px 3px rgba(212, 182, 120, 0.55), 0 0 0 2px rgba(212, 182, 120, 0.85), inset 0 1px 4px rgba(252, 237, 199, 0.7), inset 0 0 60px rgba(212, 182, 120, 0.24);
      }
      38% {
        box-shadow: 0 30px 70px -15px rgba(2, 8, 6, 0.85), 0 0 0 1px rgba(184, 151, 90, 0.35), inset 0 1px 2px rgba(252, 237, 199, 0.45), inset 0 0 45px rgba(184, 151, 90, 0.12);
      }
    }

    #drawerOverlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    #slideDrawer {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
    }
    #slideDrawer.open {
      transform: translateX(0) !important;
    }

    .drawer-item {
      opacity: 0;
      transform: translateX(18px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #slideDrawer.open .drawer-item {
      opacity: 1;
      transform: translateX(0);
    }

    /* Sơ đồ ngang */
    .h-diagram {
      display: flex;
      gap: 14px;
      align-items: stretch;
      overflow-x: auto;
      padding: 10px 4px;
      user-select: none;
    }
    .h-diagram::-webkit-scrollbar { height: 6px; }
    .h-diagram::-webkit-scrollbar-thumb { background: #d4b678; border-radius: 99px; }
    .h-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 220px;
      position: relative;
    }
    .h-card {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(184, 151, 90, 0.35);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(15,58,46,0.04), 0 0 0 1px rgba(212, 182, 120, 0.18);
      transition: 0.3s;
    }
    .h-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15,58,46,0.1), 0 0 0 1.5px rgba(184,151,90,0.4);
    }

    @media print {
      body { background-color: #ffffff !important; }
      .no-print, #hero { display: none !important; }
      body::before, body::after { display: none; }
      .slide-page {
        page-break-after: always;
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        min-height: 100vh;
        margin: 0 !important;
      }
    }
  </style>
</head>

              <h4 class="font-bold text-xs text-brand mb-2">Phê Duyệt Handbook 2026</h4>
              <p class="text-[11px] text-ink-muted leading-relaxed">HĐQT ký duyệt văn bản Handbook chính thức để áp dụng từ 01/11/2026.</p>
            </div>
            <div class="p-4 bg-white border border-borderLine rounded-xl shadow-xs hover:border-gold transition">
              <span class="text-xs font-bold text-gold uppercase tracking-wider block mb-1">Giai đoạn 04</span>
              <h4 class="font-bold text-xs text-brand mb-2">Đồng Bộ Biểu Mẫu Chuẩn</h4>
              <p class="text-[11px] text-ink-muted leading-relaxed">Đưa toàn bộ mẫu HĐLĐ, Proposal, Báo giá, Tạm ứng lên ngăn lưu trữ trực tuyến.</p>
            </div>
            <div class="p-4 bg-white border border-borderLine rounded-xl shadow-xs hover:border-gold transition">
              <span class="text-xs font-bold text-gold uppercase tracking-wider block mb-1">Giai đoạn 05</span>
              <h4 class="font-bold text-xs text-brand mb-2">Kiểm Thử Cổng Nghỉ Phép</h4>
              <p class="text-[11px] text-ink-muted leading-relaxed">Triển khai thử nghiệm quy trình gửi đơn phép số hóa tại ePlus⁺ và Engage⁺.</p>
            </div>
            <div class="p-4 bg-brand text-white rounded-xl shadow-xs p-4 flex flex-col justify-between">
              <div>
                <span class="text-xs font-bold text-gold uppercase tracking-wider block mb-1">Giai đoạn 06</span>
                <h4 class="font-bold text-xs text-gold-light mb-2">Kích Hoạt Vận Hành 2027</h4>
                <p class="text-[11px] text-gray-200">Toàn bộ hệ thống chạy đồng bộ theo mô hình mới từ 01/01/2027.</p>
              </div>
            </div>
          </div>
        `
      },
      {
        id: 12,
        type: 'closing',
        content: `
          <div class="flex flex-col justify-center items-center h-full text-center p-8 sm:p-14 relative z-10 my-auto">
            <div class="mb-5">
              <img src="https://leha-os.github.io/assets/logoweplus_white_transparent.png" alt="WePlus⁺" class="h-20 object-contain drop-shadow-[0_8px_20px_rgba(0,0,0,0.5)]">
            </div>

            <h4 class="text-xs font-bold uppercase tracking-widest text-gold mb-2">Tầm Nhìn 2027–2030</h4>
            <h1 class="text-3xl sm:text-5xl font-extrabold text-white leading-tight mb-6">
              MỘT HỆ THỐNG. ĐA NĂNG LỰC. <br>
              <span class="gold-gradient-text">MỘT HƯỚNG ĐI CHUNG.</span>
            </h1>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 w-full max-w-3xl border-t border-white/10 pt-6 text-white text-left">
              <div class="bg-brand-2/50 p-3 rounded-lg border border-gold/20">
                <h5 class="text-gold font-bold text-sm">CONNECT</h5>
                <p class="text-[10px] text-gray-200 uppercase tracking-wider">Kết nối năng lực</p>
              </div>
              <div class="bg-brand-2/50 p-3 rounded-lg border border-gold/20">
                <h5 class="text-gold font-bold text-sm">COLLABORATE</h5>
                <p class="text-[10px] text-gray-200 uppercase tracking-wider">Cộng hưởng nguồn lực</p>
              </div>
              <div class="bg-brand-2/50 p-3 rounded-lg border border-gold/20">
                <h5 class="text-gold font-bold text-sm">CREATE</h5>
                <p class="text-[10px] text-gray-200 uppercase tracking-wider">Gia tăng giá trị</p>
              </div>
              <div class="bg-brand-2/50 p-3 rounded-lg border border-gold/20">
                <h5 class="text-gold font-bold text-sm">GROWTH</h5>
                <p class="text-[10px] text-gray-200 uppercase tracking-wider">Bứt phá cùng hệ sinh thái</p>
              </div>
            </div>

            <p class="text-xs sm:text-sm font-light text-gray-200 mt-8 max-w-xl italic">
              "WePlus⁺ là nền tảng kết nối và cộng hưởng năng lực trong hệ sinh thái Tgroup, nơi các đơn vị thành viên cùng phát huy thế mạnh, nguồn lực và chuyên môn để mở rộng năng lực của toàn hệ thống, kiến tạo những giá trị lớn hơn cho khách hàng và nâng tầm vị thế Tgroup trong nước và quốc tế."
            </p>
          </div>
        `
      }
    ];

    let currentSlide = 0;

    function renderSlide(index) {
      const slide = SLIDES[index];
      const container = document.getElementById('slideContent');
      const totalSlides = SLIDES.length;
      const formattedCur = String(index + 1).padStart(2, '0');
      const formattedTotal = String(totalSlides).padStart(2, '0');

      document.getElementById('slideCounterLabel').innerText = `${formattedCur}/${formattedTotal}`;
      document.getElementById('slideIndicator').innerText = `${formattedCur} / ${formattedTotal}`;

      if (slide.type === 'cover' || slide.type === 'closing') {
        container.className = 'slide-page slide-dark-metal rounded-2xl relative min-h-[640px] flex flex-col justify-between overflow-hidden text-white';
      } else {
        container.className = 'slide-page slide-light-glass rounded-2xl relative min-h-[640px] flex flex-col justify-between overflow-hidden text-ink p-6 sm:p-8';
      }

      let html = '';

      if (slide.type === 'cover' || slide.type === 'closing') {
        html = slide.content;
      } else {
        html = `
          <div class="flex items-center justify-between pb-3.5 border-b border-gold/40 mb-4 relative z-10">
            <div>
              ${slide.subtitle ? `<span class="text-[10px] font-bold uppercase tracking-widest text-gold block mb-0.5">${slide.subtitle}</span>` : ''}
              <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight gold-gradient-title">${slide.title}</h2>
            </div>
            <span class="text-3xl font-bold gold-gradient-text italic font-mono drop-shadow-[0_2px_6px_rgba(184,151,90,0.35)]">
              ${formattedCur}
            </span>
          </div>
          <div class="flex-grow flex flex-col justify-center relative z-10">
            ${slide.content}
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function initDeck() {
      renderSlide(currentSlide);
      const list = document.getElementById('drawerList');
      list.innerHTML = SLIDES.map((s, i) => {
        const titleText = (s.title || (s.type === 'cover' ? 'Trang Bìa' : 'Lời Kết')).toUpperCase();
        return `
          <button onclick="goToSlide(${i})" style="transition-delay: ${i * 30}ms" class="drawer-item w-full text-left px-3.5 py-2.5 text-xs rounded-xl transition-all duration-300 flex items-center justify-between group border ${
            currentSlide === i 
              ? 'bg-gradient-to-r from-gold-soft/90 to-white/95 font-bold text-brand border-gold/50 shadow-xs' 
              : 'border-transparent text-ink-muted hover:bg-white/70 hover:border-gold/20 hover:text-brand'
          }">
            <span class="truncate pr-2 group-hover:translate-x-1 transition-transform">
              ${String(i + 1).padStart(2, '0')}. ${titleText}
            </span>
            <span class="w-1.5 h-1.5 rounded-full transition-all ${currentSlide === i ? 'bg-gold scale-125 shadow-[0_0_6px_rgba(184,151,90,0.8)]' : 'bg-transparent group-hover:bg-gold/40'}"></span>
          </button>
        `;
      }).join('');
    }

    function toggleDrawer() {
      const drawer = document.getElementById('slideDrawer');
      const overlay = document.getElementById('drawerOverlay');
      const isOpen = drawer.classList.toggle('open');
      overlay.classList.toggle('open', isOpen);
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
      initDeck();
      const drawer = document.getElementById('slideDrawer');
      const overlay = document.getElementById('drawerOverlay');
      drawer.classList.remove('open');
      overlay.classList.remove('open');
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide(currentSlide);
        initDeck();
      }
    }

    function nextSlide() {
      if (currentSlide < SLIDES.length - 1) {
        currentSlide++;
        renderSlide(currentSlide);
        initDeck();
      }
    }

    function enterPresentation() {
      const hero = document.getElementById('hero');
      hero.classList.add('out');
      setTimeout(() => hero.remove(), 850);
    }

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      const hero = document.getElementById('hero');
      if (hero && !hero.classList.contains('out')) {
        if (e.key === 'Enter' || e.key === ' ') {
          enterPresentation();
          return;
        }
      }
      if (e.key === 'ArrowRight' || e.key === ' ') nextSlide();
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'Escape') {
        const drawer = document.getElementById('slideDrawer');
        const overlay = document.getElementById('drawerOverlay');
        drawer.classList.remove('open');
        overlay.classList.remove('open');
      }
    });

    window.onload = function() {
      initDeck();
    };
  </script>
</body>
</html>
