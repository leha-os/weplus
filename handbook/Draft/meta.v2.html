@keyframes spin{to{transform:rotate(360deg)}}@keyframes line{to{width:100px}}

.logo{font-family:var(--font);font-weight:700;font-size:16px}.logo img.lw{height:22px;vertical-align:middle}
.top.sub{opacity:.7;font-size:11px;flex:1}.pill{padding:2px 8px;border:1px solid var(--accent);color:var(--accent);font-size:9px;font-weight:700;letter-spacing:.1em;border-radius:99px}
button.btn{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--on-dark);padding:5px 12px;border-radius:99px;cursor:pointer;font:inherit;font-size:11px}

.wrap{max-width:var(--maxw);margin:0 auto;padding:20px 12px 70px;position:relative;z-index:1}
h1{font-family:var(--font);font-size:20px;color:var(--brand);margin:0 0 4px;line-height:1.25;font-weight:700}.lead{color:var(--muted);margin:0 0 12px;font-size:11px}
.tools{display:flex;gap:6px;margin-bottom:6px}.search{flex:1;padding:8px 12px;border:1px solid var(--line);border-radius:99px;font:inherit;background:var(--card);font-size:11px}

const ALIGNMENT_REASON=["【entity-Engage¦canonical_name=Engage】 và ePlus dùng hai khung giờ khác nhau → cần BOD thống nhất một khung chung, hoặc xác nhận giữ riêng theo công ty.","Ngưỡng tính nửa ngày phép (10h và 10:30) khác nhau → cần BOD thống nhất.","ePlus không ghi số ngày phép cơ bản → HR xác nhận ePlus áp dụng theo Luật hay như 【entity-Engage¦canonical_name=Engage】.","Hai cách hiểu: “+1 ngày mỗi năm thâm niên” và “+1 ngày sau 5 năm”; Excel hai sheet cũng khác ở ePlus → cần BOD và HR chốt cách tính.","Hai khung báo trước khác nhau → HR đề xuất phương án, BOD thống nhất.","Giới hạn nghỉ liên tiếp và tỷ lệ team nghỉ chung khác nhau → cần BOD thống nhất.","Hai cơ chế khác bản chất (nghỉ sau chủ nhật chạy chương trình và WFH tối đa 1 ngày/tháng) → BOD chọn cơ chế chung.","Mức 【entity-Engage¦canonical_name=Engage】 và ePlus trùng nhau; Excel còn mức 150k ở công ty khác → Kế toán và BOD xác nhận mức áp dụng.","Mức tiền trùng nhưng người duyệt khác nhau (Leader và DA, hay Project leader) → thống nhất người duyệt.","ePlus có điều kiện loại trừ khi dùng app xe công ty, 【entity-Engage¦canonical_name=Engage】 không nêu → cần thống nhất.","【entity-Engage¦canonical_name=Engage】 có trần 150k/ngày, ePlus không nêu mức → cần thống nhất trần chung.","File ePlus không nêu, chỉ có trong Excel → HR xác nhận mức áp dụng cho ePlus.","Có đề xuất tăng lên 2.000.000 nhưng chưa được duyệt → BOD quyết định.","Ba nguồn khác nhau (Grab công ty, app Be, Excel) → Kế toán và BOD thống nhất hình thức và hạn mức.","Sơ đồ 【entity-Engage¦canonical_name=Engage】 cũ khác sơ đồ 2027 → BOD xác nhận sơ đồ chính thức.","Slide ePlus cũ chưa có Team GolfCare⁺ → xác nhận và cập nhật slide."];

{id:"s02",number:"02",nav:"Quy định chung & Văn hóa",title:"Quy định chung & Văn hóa",status:"DRAFT",subsections:[
{title:"Văn hóa làm việc (Engage⁺)",status:"DRAFT",src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf",blocks:[L(["Cùng làm, cùng chia sẻ. Kết quả là thành quả của teamwork.","Giao tiếp nhã nhặn, vừa phải, chuẩn mực, lịch sự, văn minh.","Hỗ trợ tương tác trên tinh thần cùng nhau xây dựng văn hóa công ty.","Trong tất cả các hoạt động văn hóa của công ty, yêu cầu phải sắp xếp tham gia đầy đủ."])]},
{title:"Văn hóa làm việc (ePlus)",status:"MISSING",src:"EPLUS_QUY_ĐỊNH_CHUNG (cũ).pdf",blocks:[{type:"text",text:NA+" — file ePlus không có mục văn hóa riêng."}]},
{title:"Trang phục văn phòng (Engage⁺)",status:"DRAFT",src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf",blocks:[T(["","Nữ","Nam"],[["Tiêu chuẩn","Lịch sự – gọn gàng thanh lịch","Lịch sự – gọn gàng trang nhã"],["Không chấp nhận","Trang phục quá mỏng; quần sooc, váy quá ngắn; áo ba lỗ, 2 dây, cúp ngực…","Quần short; áo ba lỗ, áo sát nách; dép lê"]]), {type:"note",text:"Thứ 2 hàng tuần: tất cả nhân viên mặc áo đồng phục của công ty Engage+."}]},
{title:"Nội quy văn phòng Engage⁺",status:"DRAFT",src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf — 5 slide Nội quy",blocks:[{type:"text",text:"Trong thời gian làm việc:"},L(["Nói chuyện điện thoại trong VP với âm lượng vừa phải; bàn công việc thì vào phòng họp chung.","Giờ nghỉ trưa: tôn trọng, giữ trật tự, tránh cười nói lớn tiếng.","Giữ vệ sinh nơi làm việc cá nhân và chỗ dùng chung.","Tắt điện, điều hoà, đóng cửa nếu là người ra về cuối cùng.","Ăn uống giữ vệ sinh sạch sẽ.","Không tự ý sử dụng đồ dùng cá nhân của người khác.","Đồ dùng chung lấy xong để lại đúng vị trí gọn gàng; không bày bừa trên bàn trống, khu vực chung, chỗ người khác.","Có ý thức sử dụng tiết kiệm và bảo vệ tài sản chung.","Các bạn nam hỗ trợ bưng nước theo lịch dán trên bình nước chung.","Nếu hút thuốc, ra ngoài lối thoát hiểm, không vứt tàn thuốc lung tung."]),{type:"text",text:"Môi trường làm việc, vui lòng:"},L(["Hạn chế nói tục, chửi thề trong VP.","Hạn chế đem thức ăn, đồ uống nặng mùi vào VP (nước mắm, mít, sầu riêng, mắm ruốc, mắm tôm…).","Không để bánh trái, đồ ăn vặt lung tung; cất tủ đóng gói cẩn thận; trước khi ra về sắp xếp nơi làm việc cá nhân.","Không nói chuyện riêng, trao đổi lớn tiếng, bật nhạc to trong VP.","Không để rác rơi vãi; bỏ rác đúng nơi quy định."]),{type:"text",text:"Phòng họp sau khi sử dụng:"},L(["Xếp lại bàn ghế trật tự, gọn gàng.","Tắt đèn, máy lạnh.","Hạn chế ăn uống thức ăn nặng mùi; nếu có thì xịt phòng xử lý tạm.","Tránh trao đổi lớn tiếng ảnh hưởng mọi người trong VP.","Không để bánh trái, đồ ăn vặt trong phòng.","Tài liệu, vật dụng cá nhân đem ra ngoài."]),{type:"text",text:"WC khi sử dụng:"},L(["Để rác đúng nơi quy định.","Không hút thuốc.","Không xịt nước ra sàn, thành bồn cầu.","Đổ cặn xác thức ăn, đồ uống vào thùng rác, không đổ vào bồn rửa tay.","Chén bát, đồ nấu ăn rửa sạch, lau khô, cất lại tủ gọn gàng; không bày bừa trên bàn rửa tay, trong WC."])]},
{title:"VPP & đồ dùng văn phòng (Engage⁺)",status:"DRAFT",src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf",blocks:[L(["Đồ dùng VPP cố định (bấm giấy, thước, kéo, dao rọc giấy…): chỉ giao 1 lần/1 cái/1 người.","Lấy VPP & đồ dùng VPP: liên hệ HCNS; cần VPP khác: đăng ký HCNS duyệt mua.","Đồ dùng cá nhân sắp xếp cất giữ ở chỗ ngồi.","Đồ dùng, vật dụng, hàng hóa chương trình của team nào để ở kho; nếu để ở VP thì để chỗ của team mình.","In ấn: giữ vệ sinh nơi bàn in; không để giấy in sai lung tung; dùng giấy in tiết kiệm; hóa đơn, giấy tờ thanh toán, giải chi, tài liệu xem cá nhân/nháp cố gắng dùng giấy 1 mặt."])]},
{title:"Bảo mật thông tin (Engage⁺)",status:"DRAFT",src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf",blocks:[L(["Mọi thông tin về lương thưởng phải được bảo mật, không chia sẻ cho người khác.","Chứng từ hóa đơn, báo giá, hợp đồng, CE-CO không để lung tung; in sai hoặc không dùng tới có thể giữ làm giấy nháp cho riêng mình; nếu làm giấy 1 mặt thì phải gạch bỏ mặt còn lại."])]},
{title:"Hành chính nội bộ — chăm sóc văn phòng & 5S",status:"DRAFT",src:"TGROUP_CHÍNH_SÁCH_CHUNG.xlsx — sheet “Hành chính nội bộ”",blocks:[{type:"text",text:"1. Không gian làm việc"}, L(["Kiểm tra vệ sinh toàn bộ văn phòng trước giờ làm.","Kiểm tra Pantry, phòng họp, khu tiếp khách.","Kiểm tra nhà vệ sinh sạch sẽ, đủ giấy, xà phòng, nước rửa tay.","Kiểm tra điều hòa, đèn, máy lọc nước.","Sắp xếp bàn ghế ngay ngắn sau mỗi cuộc họp.","Kiểm tra cây xanh, tưới nước.","Loại bỏ đồ vật hư hỏng hoặc không còn sử dụng.","Đảm bảo lối đi thông thoáng, an toàn."]),{type:"text",text:"2. Pantry & đồ dùng"}, L(["Chuẩn bị trà, cà phê, nước uống.","Bổ sung bánh/snack nếu công ty có chính sách.","Kiểm tra hạn sử dụng thực phẩm; tủ lạnh sạch sẽ.","Sắp xếp ly, chén, muỗng đúng vị trí.","Quản lý kho văn phòng phẩm; bổ sung giấy in, bút, sổ tay."]),{type:"text",text:"3. Truyền cảm hứng"}, L(["Cập nhật bảng tin nội bộ.","Trang trí văn phòng theo mùa."]),{type:"text",text:"4. Quản lý tài sản"}, L(["Theo dõi bàn ghế hư hỏng, sửa chữa.","Theo dõi máy in: bảo trì, mực in.","Theo dõi máy lạnh: bảo trì, sửa chữa.","Theo dõi thiết bị các phòng họp.","Báo sửa chữa kịp thời khi phát hiện hỏng hóc."]),{type:"text",text:"5. Chăm sóc tinh thần nhân viên"}, L(["Thiệp sinh nhật từng cá nhân; thiệp chúc mừng kết hôn; thiệp chúc mừng sinh con; thăm hỏi ốm đau."]),{type:"text",text:"Tiêu chuẩn 5S văn phòng"}, L(["Sàng lọc: loại bỏ vật dụng không cần thiết.","Sắp xếp: đồ dùng có vị trí rõ ràng, dễ tìm.","Sạch sẽ: duy trì vệ sinh hằng ngày.","Săn sóc: kiểm tra định kỳ, nhắc nhở và cải tiến.","Sẵn sàng: hình thành thói quen giữ gìn không gian chung.","Tổ chức chấm điểm 5S theo từng khu vực hoặc phòng ban."]),T(["Tần suất","Công việc định kỳ"],[["Hằng ngày","Kiểm tra vệ sinh và Pantry; kiểm tra phòng họp trước/sau khi sử dụng; bổ sung VPP; kiểm tra thiết bị; chăm sóc cây cảnh; tiếp nhận và xử lý phản ánh của nhân viên kịp thời"],["Hằng tuần","Tổng vệ sinh khu vực chung; kiểm kê VPP; trang trí hoa/cây xanh; tổ chức một hoạt động gắn kết ngắn; kiểm tra tài sản và thiết bị"],["Hằng tháng","Đánh giá mức độ hài lòng của nhân viên; đề xuất cải thiện không gian làm việc; thay đổi góc trang trí theo chủ đề; báo cáo chi phí hành chính và kế hoạch tháng tiếp theo"]]),{type:"note",text:"Dự trù ngân sách tổng của bộ phận Hành chính: "+NA}]},

]},
{id:"s06",number:"06",nav:"Quy trình & Hướng dẫn",title:"Quy trình & Hướng dẫn",status:"DRAFT",subsections:[

const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const badge=st=>`<span class="st ${st}">${STATUS_LABEL[st]}</span>`;
function renderOrgMap(){
  const d=ORG_DATA;
  const team=t=>`<div class="team"><b class="line-clamp-2 break-words">${esc(t[0])}</b>${t[1]?`<span>${esc(t[1])}</span>`:""}${t[2]?`<em>${esc(t[2])}</em>`:""}</div>`;
  const card=c=>`<div class="orgcard"><h5 class="break-words">${esc(c.title||c.name)}</h5>${c.lead?`<p class="lead2 break-words">${esc(c.lead)}</p>`:""}${c.teams.map(team).join("")}</div>`;
  const cluster=k=>`<div class="cl"><h4 class="break-words">${esc(k.title)}</h4><p class="break-words">${esc(k.note)}</p><div class="grid2">${k.companies.map(card).join("")}</div></div>`;
  return `<div class="orgmap">
    <div class="orgcard top"><h4>${esc(d.top.title)}</h4><div class="two"><div><span>Chủ tịch HĐQT</span>${esc(d.top.chair)}</div><div><span>Ban Điều hành</span>${esc(d.top.board)}</div></div></div>
    <div class="conn"></div>
    <div class="band"><span class="bl">KHỐI HỖ TRỢ & PHÁT TRIỂN</span><div class="grid2">${d.support.map(card).join("")}</div></div>
    <div class="conn"></div>
    <div class="band"><span class="bl">KHỐI VẬN HÀNH KINH DOANH</span>${d.clusters.map(cluster).join("")}</div>
  </div>`;
}
const vnd=n=>n.toLocaleString("vi-VN")+"đ";
function monthHTML(m){const sp=(MONTH_SPECIAL[m]||[]).map(x=>`<li class="break-words">${esc(x)}</li>`).join("");const bd=BIRTHDAYS.filter(b=>b.month===m).map(b=>`${esc(b.name)} (${b.day}/${m})`).join(", ");return `<div><h4>Tháng ${m}</h4><ul><li>Happy Friday 16:00 T6 (50k/người/tuần)</li><li>Sinh nhật ngày 10</li>${sp}</ul><div class="note"><b>Sinh nhật:</b> ${bd||"chưa có"}</div></div>`;}
function renderCalendar(){const cur=new Date().getMonth()+1;const chips=Array.from({length:12},(_,i)=>i+1).map(m=>`<button class="mchip${MONTH_SPECIAL[m]?" sp":""}${m===cur?" on":""}" data-m="${m}">T${m}</button>`).join("");return `<div class="tl" id="tl">${chips}</div><div id="mwrap">${monthHTML(cur)}</div>`;}
function renderCompanyPick(){const n=["Tất cả","Engage","ePlus","Enabler","The Wall","Bức Tường","Green Wall","Nguyễn Mộc"];return `<div>${n.map((x,i)=>`<button class="cpick${i===0?" on":""}" data-c="${i}">${x}</button>`).join("")}</div>`;}
function applyCompany(idx){document.querySelectorAll("#s04 table").forEach(t=>{const th=t.querySelectorAll("thead th");if(th.length!==8||th[1].textContent!=="Engage")return;t.style.minWidth=idx?"0":"";t.querySelectorAll("tr").forEach(tr=>[...tr.children].forEach((c,j)=>{c.style.display=(!idx||j===0||j===idx)?"":"none";}));});}
function renderCalc(){const o=CALC_RATES.levels.map((l,i)=>`<option value="${i}">${esc(l[0])}</option>`).join("");return `<div class="calc"><div><label>Cấp bậc</label><select id="cLv">${o}</select></div><div><label>Số ngày công tác</label><input id="cDay" type="number" min="0" value="2"></div><div><label>Số đêm khách sạn</label><input id="cNight" type="number" min="0" value="1"></div><div><label>Ra ga/sân bay</label><select id="cAir"><option value="0">Không</option><option value="1">1 chiều</option><option value="2">Khứ hồi</option></select></div></div><div class="res" id="cRes"></div><div class="note">Mức tối đa thực tế. ePlus: nhân viên dùng app xe công ty không được hỗ trợ ra ga/sân bay.</div>`;}
function calcUpdate(){const l=CALC_RATES.levels[+document.getElementById("cLv").value];const d=Math.max(0,+document.getElementById("cDay").value||0),n=Math.max(0,+document.getElementById("cNight").value||0),a=+document.getElementById("cAir").value;const f=l[1]*d,h=l[2]*n,ap=CALC_RATES.airport*a;const el=document.getElementById("cRes");if(el)el.innerHTML=`Ăn uống: <b>${vnd(f)}</b> · KS: <b>${vnd(h)}</b> · Sân bay: <b>${vnd(ap)}</b><br>Tổng tối đa: <span class="big">${vnd(f+h+ap)}</span>`;}
const decKey="hb_decisions";let decState={};try{decState=JSON.parse(localStorage.getItem(decKey)||"{}")}catch(e){}
function renderDecisions(){const rows=ALIGNMENT_DATA.map((a,i)=>[a,i]).filter(([a])=>a[5]==="NEEDS_ALIGNMENT"||a[5]==="PROPOSED");const r=rows.map(([a,i],k)=>{const st=decState[i]||{};return `<tr class="${st.done?"done":""}"><td>${k+1}</td><td><b class="break-words">${esc(a[0])}</b><br><span class="line-clamp-2">${esc(a[4])}</span></td><td class="line-clamp-2 break-words">${esc(ALIGNMENT_REASON[i])}</td><td><input type="text" data-k="${i}" data-f="who" value="${esc(st.who||"BOD")}"></td><td><input type="date" data-k="${i}" data-f="date" value="${st.date||""}"></td><td style="text-align:center"><input type="checkbox" data-k="${i}" data-f="done"${st.done?" checked":""}></td></tr>`}).join("");return `<p><b id="decCount"></b> <button class="btn" id="decPdf" style="color:var(--brand);border-color:var(--brand)">Xuất PDF gửi họp</button></p><div class="tw dec"><table><thead><tr><th>#</th><th>Nội dung cần quyết</th><th>Lý do</th><th>Người quyết</th><th>Hạn chót</th><th>Đã chốt</th></tr></thead><tbody>${r}</tbody></table></div>`;}
function decCount(){const t=document.querySelectorAll("#s07 input[type=checkbox]");const el=document.getElementById("decCount");if(el)el.textContent=`${[...t].filter(c=>c.checked).length}/${t.length} mục đã chốt`;}
function renderBlock(b){
  if(b.type==="list")return `<ul>${b.items.map(i=>`<li class="break-words">${esc(i)}</li>`).join("")}</ul>`;
  if(b.type==="text")return `<p class="break-words">${esc(b.text)}</p>`;
  if(b.type==="note")return `<div class="note break-words">${esc(b.text)}</div>`;
  if(b.type==="orgmap")return renderOrgMap();
  if(b.type==="calendar")return renderCalendar();
  if(b.type==="companypick")return renderCompanyPick();
  if(b.type==="calc")return renderCalc();
  if(b.type==="decisions")return renderDecisions();
  if(b.type==="org")return `<div class="org">${b.boxes.map(x=>`<div class="box"><b class="break-words">${esc(x[0])}</b><br><span class="break-words">${esc(x[1])}</span></div>`).join("")}</div>`;
  if(b.type==="table"){const h=b.head.map(x=>`<th>${esc(x)}</th>`).join("");const r=b.rows.map(row=>`<tr>${row.map(c=>`<td class="break-words">${esc(c)}</td>`).join("")}</tr>`).join("");return `<div class="tw"><table><thead><tr>${h}</tr></thead><tbody>${r}</tbody></table></div>`;}
  if(b.type==="align"){const r=b.ids.map(i=>{const a=ALIGNMENT_DATA[i];return `<tr><td><b class="break-words">${esc(a[0])}</b></td><td class="break-words line-clamp-3">${esc(a[1])}</td><td class="break-words line-clamp-3">${esc(a[2])}</td><td class="break-words">${esc(a[3])}</td><td class="break-words line-clamp-2">${esc(a[4])}</td><td class="break-words line-clamp-2">${esc(ALIGNMENT_REASON[i])}</td><td>${badge(a[5])}</td></tr>`}).join("");return `<div class="tw"><table><thead><tr><th>Nội dung</th><th>Engage</th><th>ePlus</th><th>HR/Excel</th><th>Khác biệt</th><th>Lý do</th><th>TT</th></tr></thead><tbody>${r}</tbody></table></div>`;}
  return "";
}
function renderChrome(){
  const M=HANDBOOK_META;const fb=`this.onerror=null;this.src='${M.logoBlack}'`;
  document.getElementById("logo").innerHTML=`<img class="lw" src="${M.logoWhite}" alt="WePlus⁺" loading="lazy" onerror="${fb}">`;
  document.getElementById("hdrSub").textContent=M.header;document.getElementById("hdrStatus").textContent=M.status;document.getElementById("foot").textContent=M.footer;document.title=M.title;
}
function initHero(){
  const h=document.getElementById("hero"),M=HANDBOOK_META,fb=`this.onerror=null;this.src='${M.logoBlack}'`;
  h.innerHTML=`<div class="hero-in"><img class="hero-w" src="${M.logoWhite}" alt="WePlus⁺" loading="lazy" onerror="${fb}"><div class="hero-line"></div><h2 class="hero-title break-words">Handbook 2026</h2><div class="hero-sub break-words">${esc(M.subtitle)}</div><button class="hero-btn" id="enter">Vào Handbook</button></div>`;
  let seen=false;try{seen=sessionStorage.getItem("hb_seen")==="1"}catch(e){}const close=()=>{h.classList.add("out");document.body.classList.remove("lock");try{sessionStorage.setItem("hb_seen","1")}catch(e){}setTimeout(()=>h.remove(),700);};if(seen){h.remove();return;}document.body.classList.add("lock");document.getElementById("enter").addEventListener("click",close);
}
function renderSections(){
  document.getElementById("nav").innerHTML=HANDBOOK_SECTIONS.map(s=>`<a data-id="${s.id}">${s.number} ${esc(s.nav)}</a>`).join("");
  const cnt={};HANDBOOK_SECTIONS.forEach(x=>x.subsections.forEach(y=>cnt[y.status]=(cnt[y.status]||0)+1));
  const legend=`<div class="legend">${Object.keys(STATUS_LABEL).filter(k=>cnt[k]).map(k=>`<button class="st lg ${k}" data-st="${k}">${STATUS_LABEL[k]} · ${cnt[k]}</button>`).join("")}</div>`;
  const secs=HANDBOOK_SECTIONS.map(s=>`
    <section class="sec" id="${s.id}">
      <h2><span style="color:var(--accent);font-weight:800">${s.number}</span><span class="break-words line-clamp-2">${esc(s.title)}</span> ${badge(s.status)}</h2>
      ${s.subsections.map((sub,k)=>`
        <details class="blk" data-st="${sub.status}"${(k===0||sub.open)?" open":""}>
          <summary><span class="break-words line-clamp-2">${esc(sub.title)}</span> ${badge(sub.status)}</summary>
          <div class="body"><p class="src break-words">Nguồn: ${esc(sub.src)}</p>${sub.blocks.map(renderBlock).join("")}</div>
        </details>`).join("")}
    </section>`).join("");
  document.getElementById("app").innerHTML=`<h1 class="break-words">${esc(HANDBOOK_META.title)}</h1><p class="lead break-words">${esc(HANDBOOK_META.subtitle)}</p><div class="tools"><input class="search" id="q" placeholder="Tìm kiếm..."><button id="toggleAll">Mở/đóng tất cả</button></div>${legend}${secs}`;
}
function initTabs(){
  const links=[...document.querySelectorAll("#nav a")],secs=[...document.querySelectorAll("section.sec")];
  const show=id=>{links.forEach(a=>a.classList.toggle("on",a.dataset.id===id));secs.forEach(x=>x.classList.toggle("on",x.id===id));secs.forEach(x=>x.style.display=x.id===id?"block":"none");};
  links.forEach(a=>a.addEventListener("click",()=>{show(a.dataset.id);scrollTo(0,document.getElementById("app").offsetTop-8);}));
  show(HANDBOOK_SECTIONS[0].id);
  document.querySelectorAll("section.sec>h2").forEach(h=>h.addEventListener("click",()=>h.parentElement.classList.toggle("collapsed")));
}
function initSearch(){
  let q="",st="";
  const apply=()=>{const active=!!(q||st);document.body.classList.toggle("searching",active);document.querySelectorAll("details.blk").forEach(d=>{const hit=(!q||d.textContent.toLowerCase().includes(q))&&(!st||d.dataset.st===st);d.style.display=hit?"":"none";if(active&&hit)d.open=true;});};
  const input=document.getElementById("q");if(input)input.addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();apply();});
  document.querySelectorAll(".lg").forEach(b=>b.addEventListener("click",()=>{st=(st===b.dataset.st)?"":b.dataset.st;document.querySelectorAll(".lg").forEach(x=>x.classList.toggle("on",x.dataset.st===st));apply();}));
  document.getElementById("toggleAll")?.addEventListener("click",()=>{const cur=document.querySelectorAll("section.sec[style*='block'] details.blk, section.sec.on details.blk");const anyClosed=[...cur].some(d=>!d.open);cur.forEach(d=>d.open=anyClosed);});
}
function initMotion(){
  const bar=document.getElementById("prog");let tick=false;addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{const h=document.documentElement.scrollHeight-innerHeight;bar.style.transform=`scaleX(${h>0?scrollY/h:0})`;tick=false;});},{passive:true});
}
function renderApp(){
  renderChrome();renderSections();initTabs();initSearch();initMotion();
  document.getElementById("btnPdf")?.addEventListener("click",()=>{document.querySelectorAll("details.blk").forEach(d=>d.open=true);document.querySelectorAll(".sec").forEach(s=>s.classList.remove("collapsed"));print();});
  const b=document.getElementById("toTop");addEventListener("scroll",()=>{b.style.display=scrollY>400?"block":"none"},{passive:true});b.addEventListener("click",()=>scrollTo(0,0));
  document.addEventListener("click",e=>{const m=e.target.closest(".mchip"),c=e.target.closest(".cpick");if(m){document.querySelectorAll(".mchip").forEach(x=>x.classList.toggle("on",x===m));document.getElementById("mwrap").innerHTML=monthHTML(+m.dataset.m);}if(c){document.querySelectorAll(".cpick").forEach(x=>x.classList.toggle("on",x===c));applyCompany(+c.dataset.c);}if(e.target.id==="decPdf"){document.body.classList.add("print-dec");document.querySelectorAll("#s07 details").forEach(d=>d.open=true);print();}});
  addEventListener("afterprint",()=>document.body.classList.remove("print-dec"));
  document.addEventListener("input",e=>{if(e.target.closest(".calc"))calcUpdate();const k=e.target.dataset.k;if(k===undefined)return;const st=decState[k]=decState[k]||{};const f=e.target.dataset.f;st[f]=f==="done"?e.target.checked:e.target.value;if(f==="done"){e.target.closest("tr").classList.toggle("done",e.target.checked);decCount();}try{localStorage.setItem(decKey,JSON.stringify(decState));}catch(x){}});
  if(document.getElementById("cLv"))calcUpdate();decCount();initHero();
}
document.addEventListener("DOMContentLoaded",renderApp);
</script>
