<style>
/* ZONE 0 — THEME_GLOBAL
   BRIEF: Toàn bộ màu, font, khoảng cách | All colors, fonts, spacing
   EDITABLE: Giá trị biến trong :root | Variable values in :root
   FIX AT: THEME_GLOBAL */
:root{
  --brand:#0f5132; --brand-2:#1b7a4b; --brand-soft:#e8f3ec; --accent:#9acd32;
  --ink:#1c2420; --muted:#5d6b63; --line:#dbe3de; --bg:#f6f8f7; --card:#ffffff;
  --st-official:#1b7a4b; --st-draft:#8a6d00; --st-align:#b3261e; --st-missing:#5d6b63; --st-proposed:#5b3fa3;
  --st-official-bg:#e3f4ea; --st-draft-bg:#fff4cc; --st-align-bg:#fde8e6; --st-missing-bg:#eceeed; --st-proposed-bg:#ece6f7;
  --font:"Inter","Segoe UI",Roboto,Arial,sans-serif; --radius:6px; --maxw:1040px;
}
*{box-sizing:border-box} html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.6;font-size:15px}

/* Header + Nav | Đầu trang + thanh điều hướng */
header.top{background:var(--brand);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;letter-spacing:.3px} .logo img{height:28px;vertical-align:middle}
.top .sub{opacity:.85;font-size:13px;flex:1}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--accent);color:var(--brand)}
button.btn{border:1px solid #fff;background:transparent;color:#fff;padding:7px 14px;border-radius:var(--radius);cursor:pointer;font:inherit;font-size:13px}
button.btn:hover{background:#fff;color:var(--brand)}
nav.nav{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:0 12px;white-space:nowrap}
nav.nav a{padding:12px 12px;color:var(--muted);text-decoration:none;font-size:13.5px;border-bottom:3px solid transparent}
nav.nav a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
.wrap{max-width:var(--maxw);margin:0 auto;padding:24px 16px 80px}
h1{font-size:28px;color:var(--brand);margin:8px 0 4px;line-height:1.25}
.lead{color:var(--muted);margin:0 0 18px}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;margin-bottom:8px}

/* Section + blocks | Mục + khối nội dung */
section.sec{margin-top:34px}
section.sec>h2{font-size:21px;color:var(--brand);border-bottom:2px solid var(--brand);padding-bottom:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
section.sec>h2 .num{opacity:.5}
details.blk{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin:10px 0}
details.blk>summary{cursor:pointer;padding:12px 16px;font-weight:650;list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.blk>summary::before{content:"▸";color:var(--brand)} details[open].blk>summary::before{content:"▾"}
.body{padding:0 16px 14px}
.src{font-size:12px;color:var(--muted);margin:0 0 8px}
.body ul{margin:6px 0 6px 18px;padding:0} .body li{margin:3px 0}
.body p{margin:6px 0}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--brand-soft);color:var(--brand)}
tr.diff td{background:var(--st-align-bg)}
.note{border-left:4px solid var(--accent);background:var(--brand-soft);padding:8px 12px;margin:8px 0;font-size:13.5px}
.empty{color:var(--st-missing);font-style:italic}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st.OFFICIAL{background:var(--st-official-bg);color:var(--st-official)} .st.DRAFT{background:var(--st-draft-bg);color:var(--st-draft)}
.st.NEEDS_ALIGNMENT{background:var(--st-align-bg);color:var(--st-align)} .st.MISSING{background:var(--st-missing-bg);color:var(--st-missing)}
.st.PROPOSED{background:var(--st-proposed-bg);color:var(--st-proposed)} .st.PENDING{background:var(--st-missing-bg);color:var(--st-missing)}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.org{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.org .box{flex:1 1 200px;border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;background:var(--card)}
.org .box b{color:var(--brand)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:24px 12px;border-top:1px solid var(--line)}
#toTop{position:fixed;right:18px;bottom:18px;background:var(--brand);color:#fff;border:0;border-radius:50%;width:42px;height:42px;cursor:pointer;display:none;font-size:18px}

/* PDF logic (print stylesheet) | Định dạng in PDF */
@page{size:A4;margin:16mm 14mm 18mm;@top-left{content:"Le Ha — WePlus⁺ Handbook v1 [DRAFT] 2026";font-size:9pt;color:#555}
  @bottom-left{content:"© 2026 Le Ha x WePlus⁺ — Internal Use Only";font-size:9pt;color:#555}
  @bottom-right{content:"Trang " counter(page) " / " counter(pages);font-size:9pt;color:#555}}
@media print{
  nav.nav,#toTop,.search,button.btn{display:none!important}
  body{background:#fff;font-size:11pt} header.top{background:#fff;color:var(--brand);padding:0}
  details.blk{break-inside:auto} details.blk>summary::before{content:""} tr,.note{break-inside:avoid}
  section.sec>h2{break-after:avoid} .tw{overflow:visible} table{min-width:0}
}
</style>

 {title:"VPP & đồ dùng văn phòng (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Đồ dùng VPP cố định (bấm giấy, thước, kéo, dao rọc giấy…): chỉ giao 1 lần/1 cái/1 người.","Lấy VPP & đồ dùng VPP: liên hệ HCNS; cần VPP khác: đăng ký HCNS duyệt mua.","Đồ dùng cá nhân sắp xếp cất giữ ở chỗ ngồi.","Đồ dùng, vật dụng, hàng hóa chương trình của team nào để ở kho; nếu để ở VP thì để chỗ của team mình.","In ấn: giữ vệ sinh nơi bàn in; không để giấy in sai lung tung; dùng giấy in tiết kiệm; hóa đơn, giấy tờ thanh toán, giải chi, tài liệu xem cá nhân/nháp cố gắng dùng giấy 1 mặt."])]},
 {title:"Bảo mật thông tin (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Mọi thông tin về lương thưởng phải được bảo mật, không chia sẻ cho người khác.","Chứng từ hóa đơn, báo giá, hợp đồng, CE-CO không để lung tung; in sai hoặc không dùng tới có thể giữ làm giấy nháp cho riêng mình; nếu làm giấy 1 mặt thì phải gạch bỏ mặt còn lại."])]},
 {title:"Hành chính nội bộ — chăm sóc văn phòng & 5S", status:"DRAFT", src:"TGROUP_CHÍNH_SÁCH_CHUNG.xlsx — sheet “Hành chính nội bộ” (cột HIỆN TRẠNG để trống)", blocks:[
  {type:"text", text:"1. Không gian làm việc"}, L(["Kiểm tra vệ sinh toàn bộ văn phòng trước giờ làm.","Kiểm tra Pantry, phòng họp, khu tiếp khách.","Kiểm tra nhà vệ sinh sạch sẽ, đủ giấy, xà phòng, nước rửa tay.","Kiểm tra điều hòa, đèn, máy lọc nước.","Sắp xếp bàn ghế ngay ngắn sau mỗi cuộc họp.","Kiểm tra cây xanh, tưới nước.","Loại bỏ đồ vật hư hỏng hoặc không còn sử dụng.","Đảm bảo lối đi thông thoáng, an toàn."]),
  {type:"text", text:"2. Pantry & đồ dùng"}, L(["Chuẩn bị trà, cà phê, nước uống.","Bổ sung bánh/snack nếu công ty có chính sách.","Kiểm tra hạn sử dụng thực phẩm; tủ lạnh sạch sẽ.","Sắp xếp ly, chén, muỗng đúng vị trí.","Quản lý kho văn phòng phẩm; bổ sung giấy in, bút, sổ tay."]),
  {type:"text", text:"3. Truyền cảm hứng"}, L(["Cập nhật bảng tin nội bộ.","Trang trí văn phòng theo mùa."]),
  {type:"text", text:"4. Quản lý tài sản"}, L(["Theo dõi bàn ghế hư hỏng, sửa chữa.","Theo dõi máy in: bảo trì, mực in.","Theo dõi máy lạnh: bảo trì, sửa chữa.","Theo dõi thiết bị các phòng họp.","Báo sửa chữa kịp thời khi phát hiện hỏng hóc."]),
  {type:"text", text:"5. Chăm sóc tinh thần nhân viên"}, L(["Thiệp sinh nhật từng cá nhân; thiệp chúc mừng kết hôn; thiệp chúc mừng sinh con; thăm hỏi ốm đau."]),
  {type:"text", text:"Tiêu chuẩn 5S văn phòng"}, L(["Sàng lọc: loại bỏ vật dụng không cần thiết.","Sắp xếp: đồ dùng có vị trí rõ ràng, dễ tìm.","Sạch sẽ: duy trì vệ sinh hằng ngày.","Săn sóc: kiểm tra định kỳ, nhắc nhở và cải tiến.","Sẵn sàng: hình thành thói quen giữ gìn không gian chung.","Tổ chức chấm điểm 5S theo từng khu vực hoặc phòng ban."]),
  T(["Tần suất","Công việc định kỳ"],[["Hằng ngày","Kiểm tra vệ sinh và Pantry; kiểm tra phòng họp trước/sau khi sử dụng; bổ sung VPP; kiểm tra thiết bị; chăm sóc cây cảnh; tiếp nhận và xử lý phản ánh của nhân viên kịp thời"],["Hằng tuần","Tổng vệ sinh khu vực chung; kiểm kê VPP; trang trí hoa/cây xanh; tổ chức một hoạt động gắn kết ngắn; kiểm tra tài sản và thiết bị"],["Hằng tháng","Đánh giá mức độ hài lòng của nhân viên; đề xuất cải thiện không gian làm việc; thay đổi góc trang trí theo chủ đề; báo cáo chi phí hành chính và kế hoạch tháng tiếp theo"]]),
  {type:"note", text:"Dự trù ngân sách tổng của bộ phận Hành chính: "+NA}]},

 {title:"Nghỉ bù (ePlus)", status:"DRAFT", src:"EPLUS_QUY_ĐỊNH_CHUNG (cũ).pdf", blocks:[L(["Event cuối tuần: nghỉ bù ½ ngày cho 1 ngày chạy event cuối tuần, trong ngày làm việc của tuần tiếp theo.","Không quy đổi ngày nghỉ bù event thành ngày phép và cộng dồn.","Ngày nghỉ bù linh động theo từng thành viên ở tuần tiếp theo để đảm bảo report kịp thời cho khách hàng.","Quay/shoot cuối tuần: tùy tính chất/độ phức tạp dự án, leader quyết định nghỉ bù hoặc chỉ được đi làm trễ ngày hôm sau.","Nghỉ bệnh phải có giấy xác nhận của bệnh viện/bác sĩ và được duyệt theo quy định luật lao động.","Tùy workload chung, Leader duyệt khoảng thời gian nghỉ phép cho từng thành viên."])]},
 {title:"Nghỉ đột xuất, thông báo ra ngoài (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Nghỉ đột xuất: gọi điện, nhắn tin cho Leader và HR; bổ sung đơn nghỉ phép sau.","Lý do cá nhân vào công ty sau 10h → nghỉ nửa ngày; về trước 15h → nghỉ nửa ngày.","Thông báo lý do ra ngoài trong giờ hành chính với cấp trên.","Nghỉ các ngày lễ theo quy định Nhà nước và quyết định của công ty."])]},
 {title:"Hợp đồng lao động & trả lương (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Ký HĐLĐ chính thức sau 2–3 tháng thử việc (nếu đạt yêu cầu).","Công ty có quyền đơn phương chấm dứt HĐLĐ nếu nhân viên tự ý bỏ việc hoặc thường xuyên không hoàn thành nhiệm vụ. Báo trước 30 ngày (HĐLĐ 1–3 năm) hoặc 07 ngày (HĐLĐ 3 tháng–1 năm).","Người lao động có quyền đơn phương chấm dứt HĐLĐ; thông báo bằng văn bản đến HR ít nhất 30 ngày.","Trả lương: chuyển khoản VND qua tài khoản ngân hàng HDBank; từ ngày 01 đến ngày 10 của tháng kế tiếp."]),{type:"note", text:"ePlus: thử việc, HĐLĐ, trả lương — "+NA}]},

/* ZONE 2 — SECTION FUNCTIONS
   BRIEF: Mỗi hàm dựng một phần giao diện | One function renders one UI part
   EDITABLE: Hàm render và tên class | Render functions and class names
   FIX AT: FUNC_ */
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const badge = st => `<span class="st ${st}">${STATUS_LABEL[st]}</span>`;

/* FUNC_RENDER_BLOCK — Dựng một khối nội dung | Render one content block */
function renderBlock(b){
  if(b.type==="list") return `<ul>${b.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
  if(b.type==="text") return `<p>${esc(b.text)}</p>`;
  if(b.type==="note") return `<div class="note">${esc(b.text)}</div>`;
  if(b.type==="org")  return `<div class="org">${b.boxes.map(x=>`<div class="box"><b>${esc(x[0])}</b><br>${esc(x[1])}</div>`).join("")}</div>`;
  if(b.type==="table"){
    const h = b.head.map(x=>`<th>${esc(x)}</th>`).join("");
    const r = b.rows.map(row=>`<tr>${row.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("");
    return `<div class="tw"><table><thead><tr>${h}</tr></thead><tbody>${r}</tbody></table></div>`;
  }
  if(b.type==="align"){
    const r = b.ids.map(i=>{const a=ALIGNMENT_DATA[i];
      return `<tr><td><b>${esc(a[0])}</b></td><td>${esc(a[1])}</td><td>${esc(a[2])}</td><td>${esc(a[3])}</td><td>${esc(a[4])}</td><td>${badge(a[5])}</td></tr>`}).join("");
    return `<div class="tw"><table><thead><tr><th>Item</th><th>Engage</th><th>ePlus</th><th>HR / Excel</th><th>Proposed Summary</th><th>Status</th></tr></thead><tbody>${r}</tbody></table></div>`;
  }
  return "";
}

/* FUNC_RENDER_SECTIONS — Dựng toàn bộ mục + điều hướng | Render all sections + nav */
function renderSections(){
  document.getElementById("nav").innerHTML = HANDBOOK_SECTIONS.map(s=>`<a href="#${s.id}">${s.number} ${esc(s.nav)}</a>`).join("");
  const legend = `<div class="legend">${Object.keys(STATUS_LABEL).map(badge).join("")}</div>`;
  const secs = HANDBOOK_SECTIONS.map(s=>`
    <section class="sec" id="${s.id}">
      <h2><span class="num">${s.number}</span>${esc(s.title)} ${badge(s.status)}</h2>
      ${s.subsections.map(sub=>`
        <details class="blk" open>
          <summary>${esc(sub.title)} ${badge(sub.status)}</summary>
          <div class="body"><p class="src">Nguồn: ${esc(sub.src)}</p>${sub.blocks.map(renderBlock).join("")}</div>
        </details>`).join("")}
    </section>`).join("");
  document.getElementById("app").innerHTML = `
    <h1>${esc(HANDBOOK_META.title)}</h1><p class="lead">${esc(HANDBOOK_META.subtitle)}</p>
    <input class="search" id="q" placeholder="Tìm kiếm trong Handbook…">${legend}${secs}`;
}

/* FUNC_HEADER_FOOTER — Đầu/chân trang | Header and footer */
function renderChrome(){
  document.getElementById("logo").innerHTML = HANDBOOK_META.logoSrc ? `<img src="${HANDBOOK_META.logoSrc}" alt="logo">` : esc(HANDBOOK_META.logoText);
  document.getElementById("hdrSub").textContent = HANDBOOK_META.header;
  document.getElementById("hdrStatus").textContent = HANDBOOK_META.status;
  document.getElementById("foot").textContent = HANDBOOK_META.footer;
  document.title = HANDBOOK_META.title;
}

/* FUNC_NAV_TRACKING — Theo dõi mục đang xem | Active section tracking */
function initNavTracking(){
  const links = [...document.querySelectorAll("#nav a")];
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){
    links.forEach(a=>a.classList.toggle("on", a.getAttribute("href")==="#"+e.target.id));
    const on = links.find(a=>a.classList.contains("on")); if(on) on.scrollIntoView({inline:"center",block:"nearest"});
  }}), {rootMargin:"-30% 0px -65% 0px"});
  document.querySelectorAll("section.sec").forEach(s=>io.observe(s));
}

/* FUNC_SEARCH — Tìm kiếm | Search filter */
function initSearch(){
  document.getElementById("q").addEventListener("input", e=>{
    const k = e.target.value.trim().toLowerCase();
    document.querySelectorAll("details.blk").forEach(d=>{
      const hit = !k || d.textContent.toLowerCase().includes(k);
      d.style.display = hit ? "" : "none"; if(k && hit) d.open = true;
    });
  });
}

/* FUNC_PDF — Tải PDF: mở hộp thoại in, chọn “Lưu thành PDF” | PDF: opens print dialog, choose “Save as PDF” */
function initPdf(){
  document.getElementById("btnPdf").addEventListener("click", ()=>{
    const opened = [...document.querySelectorAll("details.blk")];
    opened.forEach(d=>d.open = true);
    window.print();
  });
}

/* FUNC_BACK_TO_TOP — Nút lên đầu trang | Back-to-top button */
function initBackToTop(){
  const b = document.getElementById("toTop");
  window.addEventListener("scroll", ()=>{ b.style.display = window.scrollY>500 ? "block" : "none"; });
  b.addEventListener("click", ()=>window.scrollTo({top:0}));
}

renderChrome(); renderSections(); initNavTracking(); initSearch(); initPdf(); initBackToTop();
</script>
