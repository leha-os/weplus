<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WePlus⁺ Handbook 2026</title>

<style>
@font-face { font-family:"Optimistic"; font-style:normal; font-weight:400 700; font-display:swap; src:local("Segoe UI"),local("Roboto"),local("Arial"); }
:root{
  --brand:#0c2e24; --brand-2:#14503b; --accent:#b8975a; --accent-soft:#f6f0e4; --accent-2:#e8dcc0;
  --ink:#1a1f1c; --muted:#6b726d; --line:#e6e1d6; --bg:#f7f5f0; --card:#ffffff; --hero:#071a14; --on-dark:#ffffff;
  --st-official:#1f6b4a; --st-official-bg:#e4efe8; --st-draft:#5f6661; --st-draft-bg:#ecebe6;
  --font:"Optimistic",system-ui,sans-serif;
  --radius:8px; --radius-sm:6px; --maxw:860px;
  --shadow:0 1px 4px rgba(12,46,36,.06); --shadow-hover:0 8px 20px rgba(12,46,36,.10);
}
*{box-sizing:border-box;overflow-wrap:break-word;word-break:break-word}
html{scroll-behavior:smooth;height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.55;font-size:13.5px;min-height:100vh;display:flex;flex-direction:column;position:relative}
body::before,body::after{content:"";position:fixed;width:600px;height:600px;border-radius:50%;pointer-events:none;z-index:0;opacity:.35;filter:blur(70px)}
body::before{background:radial-gradient(circle at 30% 30%,rgba(184,151,90,.25),transparent 60%);top:-120px;left:-120px;animation:float 18s ease-in-out infinite alternate}
body::after{background:radial-gradient(circle at 70% 70%,rgba(12,46,36,.14),transparent 60%);bottom:-120px;right:-120px;animation:float 22s ease-in-out infinite alternate-reverse}
@keyframes float{0%{transform:translate(0,0)}100%{transform:translate(30px,20px)}}
body.lock{overflow:hidden}
#hero{position:fixed;inset:0;z-index:100;background:var(--hero);color:var(--on-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;transition:opacity.8s ease-out,visibility.8s}
#hero.out{opacity:0;visibility:hidden}
#hero::before{content:"";pointer-events:none;position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:conic-gradient(from 0deg,transparent 0,rgba(184,151,90,.16) 12%,transparent 30%,rgba(20,80,59,.55) 55%,transparent 75%);animation:spin 50s linear infinite}
.hero-in{position:relative;z-index:2;padding:20px;display:flex;flex-direction:column;align-items:center}
.hero-line{height:1px;width:0;margin:24px auto;background:var(--accent);animation:line 1s 1.2s cubic-bezier(0.16,1,0.3,1) forwards}
.hero-sub{opacity:0;margin:12px 0 32px;font-size:14px;letter-spacing:.08em;transform:translateY(10px);animation:fadeUpHero.8s 1.6s cubic-bezier(0.16,1,0.3,1) forwards}
.hero-btn{opacity:0;border:1px solid var(--accent);background:transparent;color:var(--on-dark);padding:14px 32px;font:inherit;letter-spacing:.15em;cursor:pointer;text-transform:uppercase;font-size:12px;border-radius:99px;transition:.3s ease;transform:translateY(10px);animation:fadeUpHero.8s 1.8s cubic-bezier(0.16,1,0.3,1) forwards}
.hero-btn:hover{background:var(--accent);color:var(--hero);box-shadow:0 0 20px rgba(184,151,90,.3)}
.hero-w{height:0;display:block;margin:0 auto;filter:drop-shadow(0 4px 16px rgba(0,0,0,0.4));opacity:0;animation:logoGrow 1.2s cubic-bezier(0.34,1.56,0.64,1).2s forwards}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes line{to{width:140px}}@keyframes fadeUpHero{to{opacity:1;transform:translateY(0)}}
@keyframes logoGrow{0%{height:0;opacity:0;transform:scale(.3) translateY(40px)}100%{height:160px;opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes wiggle{0%,100%{transform:translateX(0)}15%{transform:translateX(-2px)}30%{transform:translateX(2px)}45%{transform:translateX(-1px)}60%{transform:translateX(1px)}}
@keyframes blurIn{from{filter:blur(12px);opacity:0}to{filter:blur(0);opacity:1}}
header.top{background:rgba(12,46,36,.92);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);color:var(--on-dark);padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(255,255,255,.08)}
.logo img.lw{height:40px;vertical-align:middle}
.top.sub{opacity:.6;font-size:11px;flex:1}
.pill{padding:3px 9px;border:1px solid var(--accent);color:var(--accent);font-size:10px;font-weight:700;letter-spacing:.08em;border-radius:4px}
button.btn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--on-dark);padding:6px 12px;border-radius:4px;cursor:pointer;font:inherit;font-size:11.5px;transition:.2s}
button.btn:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}
nav.nav{position:sticky;top:56px;z-index:20;background:rgba(20,80,59,.96);backdrop-filter:blur(10px);display:flex;overflow-x:auto;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.12)}
nav.nav::-webkit-scrollbar{display:none}
nav.nav a{padding:12px 16px;color:rgba(255,255,255,.6);text-decoration:none;font-size:12px;font-weight:600;border-bottom:2px solid transparent;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:.03em}
nav.nav a:hover{color:var(--on-dark);background:rgba(255,255,255,.06)}
nav.nav a.on{color:var(--on-dark);border-bottom-color:var(--accent);background:rgba(255,255,255,.08)}
main.wrap{max-width:var(--maxw);margin:0 auto;padding:14px 12px 80px;width:100%;flex:1 0 auto;position:relative;z-index:1;animation:blurIn.6s cubic-bezier(.16,1,.3,1)}
.header-area{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.header-area h1{font-size:18px;font-weight:800;color:var(--brand);margin:0;letter-spacing:-.01em}
.tools{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--card);font-size:12.5px;transition:.2s}
.search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(12,46,36,.08)}
.filter-wrapper{position:relative;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);border-radius:6px;background:var(--card);transition:.2s;flex-shrink:0}
.filter-wrapper:hover{border-color:var(--brand)}
.filter-wrapper svg{width:16px;height:16px;color:var(--brand);pointer-events:none}
.filter-select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;appearance:none}
.btn-toggle-all{border:1px solid var(--brand);background:var(--card);color:var(--brand);padding:7px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:11.5px;font-weight:700;transition:.2s;white-space:nowrap}
.btn-toggle-all:hover{background:var(--brand);color:#fff}
section.sec{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow);display:none;animation:fadeUp.3s cubic-bezier(.16,1,.3,1);transition:transform.2s,box-shadow.2s}
section.sec.on,body.searching section.sec{display:block}
section.sec:hover{box-shadow:var(--shadow-hover);transform:translateY(-1px)}
section.sec>h2{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);margin:0;padding:9px 12px;border-bottom:1.5px solid var(--accent);border-left:3px solid var(--accent);display:flex;gap:8px;align-items:center;flex-wrap:wrap;cursor:pointer;user-select:none;background:linear-gradient(90deg,#fff,#fdf8ee);transition:.2s}
section.sec>h2:hover{padding-left:14px;background:#fff9ea}
section.sec.collapsed>h2{border-bottom-color:transparent;background:#fff}
section.sec>h2::after{content:"⌄";margin-left:auto;font-size:12px;transition:transform.25s;color:var(--accent);font-weight:800}
section.sec.collapsed>h2::after{transform:rotate(-90deg)}
details.blk{background:var(--card);border-top:1px solid #f1ece0;margin:0}
details.blk:first-of-type{border-top:none}
details.blk:hover{background:#fffefb}
details.blk>summary{cursor:pointer;padding:9px 12px;font-weight:600;font-size:12.5px;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::after{content:"›";margin-left:auto;font-size:14px;color:var(--accent);transition:transform.2s;font-weight:700}
details[open].blk>summary::after{transform:rotate(90deg)}
details.blk.wiggle{animation:wiggle.4s ease}
.body{padding:2px 12px 12px;animation:fadeUp.25s ease}
.src{font-size:10.5px;color:var(--muted);margin:0 0 8px;padding:6px 10px;background:var(--accent-soft);border-radius:6px;border:1px dashed var(--accent-2)}
.body ul{margin:6px 0 10px 16px;padding:0;font-size:12.5px}
.body li{margin:4px 0}
.comp-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.comp-blk{border:1px solid var(--line);border-radius:8px;background:#fff;transition:.2s;overflow:hidden}
.comp-blk:hover{border-color:var(--accent-2)}
.comp-blk>summary{padding:9px 12px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--brand);list-style:none;background:var(--accent-soft)}
.comp-blk>summary::-webkit-details-marker{display:none}
.comp-blk>summary::after{content:"⌄";font-size:12px;color:var(--accent);transition:transform.2s}
.comp-blk[open]>summary::after{transform:rotate(180deg)}
.comp-body{padding:10px;font-size:12.5px}
.tw{overflow-x:auto;margin:10px 0;border-radius:8px;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:480px}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#fdfbf6;color:var(--brand);font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:#fcfaf5}
tbody tr:hover{background:#f7f1e6}
.note{border-left:3px solid var(--accent);background:linear-gradient(90deg,var(--accent-soft),#fff);padding:8px 10px;margin:10px 0;font-size:12px;border-radius:0 6px 6px 0;color:var(--brand)}
.st{font-size:9px;font-weight:800;padding:3px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line)}
.st.OFFICIAL{background:#e4efe8;color:#1f6b4a;border-color:#cfe3d6}
.st.DRAFT,.st.NEEDS_ALIGNMENT,.st.MISSING,.st.PROPOSED,.st.PENDING{background:#ecebe6;color:#5f6661}
.tree{margin:10px 0;font-size:12.5px;line-height:1.35;user-select:none}
.tree ul{list-style:none;margin:0 0 0 14px;padding:0 0 0 14px;border-left:1.5px dashed #e8dcc0}
.tree>ul{margin:0;padding:0;border:none}
.tree li{margin:8px 0;position:relative;list-style:none}
.tree li::before{content:"";position:absolute;top:16px;left:-14px;width:10px;border-bottom:1.5px dashed #e8dcc0}
.tree>ul>li::before{display:none}
.tree summary{cursor:pointer;display:inline-flex;align-items:flex-start;gap:6px;list-style:none}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▶";font-size:8px;color:var(--accent);display:inline-block;transform:translateY(11px);transition:.2s}
.tree details[open]>summary::before{transform:translateY(11px) rotate(90deg)}
.tree.leaf>summary::before{content:"•";color:#e6e1d6;transform:translateY(9px);font-size:12px}
.n-card{display:inline-block;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);min-width:200px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.n-card:hover{border-color:var(--accent-2);box-shadow:0 8px 20px rgba(12,46,36,.08);transform:translateY(-1px)}
.n-card.root{background:linear-gradient(135deg,#0c2e24,#14503b);color:#fff;border:none;min-width:260px}
.n-card.root b{font-size:14px;color:#fff}
.n-card.bod{background:#141a18;color:#fff;border-color:var(--accent)}
.n-card.bod b{color:var(--accent);font-size:12.5px}
.n-card.cluster{background:var(--accent-soft);border-color:var(--accent-2);border-left:3px solid var(--accent)}
.n-card.company{border-left:3px solid var(--brand);background:#fff}
.n-card.team{border-style:dashed;background:#fdfbf6;min-width:180px;padding:6px 9px;box-shadow:none}
.n-card b{display:block;font-size:12.5px;color:var(--brand);margin-bottom:1px}
.n-card span.lead{display:block;font-size:11px;color:#5f6661;font-weight:600}
.n-card span.sub{display:block;font-size:10px;color:var(--muted)}
.cpick{margin:2px 4px 6px 0;border:1px solid var(--brand);background:var(--card);color:var(--brand);padding:5px 10px;border-radius:4px;cursor:pointer;font:inherit;font-size:11px;font-weight:700;transition:.2s}
.cpick.on,.cpick:hover{background:var(--brand);color:#fff}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.calc label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.calc input,.calc select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12.5px;background:var(--card);transition:.2s}
.calc input:focus,.calc select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(12,46,36,.08)}
.res{background:var(--brand);color:#fff;padding:10px 12px;border-radius:8px;margin-top:10px;font-size:12.5px}
.res b{color:var(--accent)}.res.big{font-size:18px;font-weight:800}
footer{margin-top:32px;padding:14px;text-align:center;color:var(--muted);font-size:10px;border-top:1px solid var(--line)}
#toTop{position:fixed;right:12px;bottom:12px;background:var(--brand);color:#fff;border:0;border-radius:6px;width:36px;height:36px;cursor:pointer;display:none;font-size:14px;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:50;transition:.2s}
#toTop:hover{transform:translateY(-2px)}
#prog{position:fixed;top:0;left:0;height:2px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;z-index:60}
</style>
</head>

}
function renderSections(){
  document.getElementById("nav").innerHTML=HANDBOOK_SECTIONS.map(s=>`<a data-id="${s.id}">${esc(s.nav)}</a>`).join("");
  const cnt={};HANDBOOK_SECTIONS.forEach(x=>x.subsections.forEach(y=>{ if(y.status) cnt[y.status]=(cnt[y.status]||0)+1 }));
  const stKeys=Object.keys(STATUS_LABEL).filter(k=>cnt[k]);
  const filterHtml=`<div class="filter-wrapper" title="Lọc trạng thái"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg><select id="statusFilter" class="filter-select"><option value="">Tất cả trạng thái</option>${stKeys.map(k=>`<option value="${k}">${STATUS_LABEL[k]} (${cnt[k]})</option>`).join("")}</select></div>`;
  const secs=HANDBOOK_SECTIONS.map(s=>`<section class="sec on" id="${s.id}"><h2><span>${esc(s.title)}</span></h2>${s.subsections.map(sub=>`<details class="blk" data-st="${sub.status||''}"><summary><span>${esc(sub.title)}</span>${badge(sub.status)}</summary><div class="body">${sub.src&&sub.src.trim()!==''?`<p class="src">Nguồn: ${esc(sub.src)}</p>`:''}${sub.blocks.map(renderBlock).join("")}</div></details>`).join("")}</section>`).join("");
  document.getElementById("app").innerHTML=`<div class="header-area"><h1>WePlus⁺ Handbook 2026</h1>${filterHtml}</div><div class="tools"><input class="search" id="q" placeholder="Tìm kiếm..."><button id="toggleAll" class="btn-toggle-all">Mở / Đóng tất cả</button></div>${secs}`;
}
function initTabs(){
  const links=[...document.querySelectorAll("#nav a")],secs=[...document.querySelectorAll("section.sec")];
  const show=id=>{links.forEach(a=>a.classList.toggle("on",a.dataset.id===id));secs.forEach(x=>{x.classList.toggle("on",x.id===id);x.style.display=x.id===id?"block":"none";});};
  links.forEach(a=>a.addEventListener("click",()=>{show(a.dataset.id);window.scrollTo({top:document.getElementById("app").offsetTop-8,behavior:'smooth'});}));
  show(HANDBOOK_SECTIONS[0].id);
  document.querySelectorAll("section.sec>h2").forEach(h=>{
      h.addEventListener("click",()=>{
        const sec=h.parentElement;
        sec.classList.toggle("collapsed");
        sec.style.animation='none'; sec.offsetHeight; sec.style.animation='wiggle.35s ease';
      });
    });
    document.addEventListener('click', e=>{
      const d=e.target.closest('details.blk');
      if(d &&!d.open){ d.classList.remove('wiggle'); void d.offsetWidth; d.classList.add('wiggle'); setTimeout(()=>d.classList.remove('wiggle'),400); }
    });
}
function initSearch(){
  let q="",st="";const apply=()=>{
    const active=!!(q||st);document.body.classList.toggle("searching",active);
    document.querySelectorAll("details.blk").forEach(d=>{
      const hit=(!q||d.textContent.toLowerCase().includes(q))&&(!st||d.dataset.st===st);
      d.style.display=hit?"":"none";if(active&&hit){d.open=true;d.closest('section.sec').classList.remove('collapsed');}
    });
  };
  const input=document.getElementById("q");if(input)input.addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();apply();});
  const filter=document.getElementById("statusFilter");if(filter)filter.addEventListener("change",e=>{st=e.target.value;apply();});
  document.getElementById("toggleAll")?.addEventListener("click",()=>{
    const cur=document.querySelectorAll("section.sec[style*='block'] details.blk, section.sec.on details.blk");
    const anyClosed=[...cur].some(d=>!d.open);cur.forEach(d=>d.open=anyClosed);
    const sec=document.querySelector("section.sec.on");if(sec)sec.classList.toggle('collapsed',!anyClosed);
  });
}
function initMotion(){
  const bar=document.getElementById("prog");let tick=false;
  window.addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{const h=document.documentElement.scrollHeight-window.innerHeight;bar.style.transform=`scaleX(${h>0?window.scrollY/h:0})`;tick=false;});},{passive:true});
}
function applyCompany(idx){
  document.querySelectorAll("#s04 table").forEach(t=>{
    const th=t.querySelectorAll("thead th");if(th.length!==4||th[1].textContent!=="Engage⁺")return;
    t.querySelectorAll("tr").forEach(tr=>[...tr.children].forEach((c,j)=>{c.style.display=(!idx||j===0||j===idx)?"":"none";}));
  });
}
function renderApp(){
  renderChrome();renderSections();initTabs();initSearch();initMotion();
  document.getElementById("btnPdf")?.addEventListener("click",()=>{
    document.querySelectorAll("details").forEach(d=>d.open=true);document.querySelectorAll(".sec").forEach(s=>s.classList.remove("collapsed"));
    setTimeout(()=>window.print(),200);
  });
  const b=document.getElementById("toTop");
  window.addEventListener("scroll",()=>{b.style.display=window.scrollY>400?"block":"none"},{passive:true});
  b.addEventListener("click",()=>window.scrollTo({top:0,behavior:'smooth'}));
  document.addEventListener("click",e=>{
    const c=e.target.closest(".cpick");if(c){document.querySelectorAll(".cpick").forEach(x=>x.classList.toggle("on",x===c));applyCompany(+c.dataset.c);}
  });
  document.addEventListener("input",e=>{
    if(e.target.closest(".calc"))calcUpdate();
    const k=e.target.dataset.k;if(k===undefined)return;
    const st=decState[k]=decState[k]||{};const f=e.target.dataset.f;st[f]=f==="done"?e.target.checked:e.target.value;
    if(f==="done"){e.target.closest("tr").style.opacity=e.target.checked?"0.5":"1";decCount();}
    try{localStorage.setItem("hb_decisions",JSON.stringify(decState));}catch(x){}
  });
  if(document.getElementById("cLv"))calcUpdate();decCount();initHero();
}
document.addEventListener("DOMContentLoaded",renderApp);
</script>
</body>
