}

function renderBlock(b){
  if(b.type==="list")return `<ul>${b.items.map(i=>`<li class="break-words">${esc(i)}</li>`).join("")}</ul>`;
  if(b.type==="text")return `<p class="break-words">${esc(b.text)}</p>`;
  if(b.type==="note")return `<div class="note break-words">${esc(b.text)}</div>`;
  if(b.type==="orgmap")return renderOrgMap();
  if(b.type==="calendar")return renderCalendar();
  if(b.type==="companypick")return renderCompanyPick();

  if(b.type==="align"){const r=b.ids.map(i=>{const a=ALIGNMENT_DATA[i];return `<tr><td><b class="break-words">${esc(a[0])}</b></td><td class="break-words line-clamp-3">${esc(a[1])}</td><td class="break-words line-clamp-3">${esc(a[2])}</td><td class="break-words">${esc(a[3])}</td><td class="break-words line-clamp-2">${esc(a[4])}</td><td>${badge(a[5])}</td></tr>`}).join("");return `<div class="tw"><table><thead><tr><th>Nội dung</th><th>Engage</th><th>ePlus</th><th>HR/Excel</th><th>Khác biệt</th><th>TT</th></tr></thead><tbody>${r}</tbody></table></div>`;}
  return "";

      <div class="sec-body">
        ${s.subsections.map((sub,k)=>`
          <details class="blk" ${sub.open?'open':''} data-st="${sub.status}">
            <summary><span class="break-words line-clamp-2">${esc(sub.title)}</span> ${badge(sub.status)}</summary>
            <div class="body"><p class="src break-words">Nguồn: ${esc(sub.src)}</p>${sub.blocks.map(renderBlock).join("")}</div>
          </details>`).join("")}
      </div>
    </section>`).join("")}`;
}
const ASSEMBLY={order:["Header","Hero","Footer"],renderApp:null};
function initTabs(){
  const links=[...document.querySelectorAll("#nav a")],secs=[...document.querySelectorAll("section.sec")];
  const show=id=>{links.forEach(a=>a.classList.toggle("on",a.dataset.id===id));secs.forEach(x=>{const on=x.id===id;x.style.display=on?'block':'none';});};
  links.forEach(a=>a.addEventListener("click",()=>{show(a.dataset.id);scrollTo(0,document.getElementById("app").offsetTop-60);}));if(links[0])show(HANDBOOK_SECTIONS[0].id);
}
function initSearch(){
  let q="",st="";
  const apply=()=>{const active=!!(q||st);document.body.classList.toggle("searching",active);document.querySelectorAll("details.blk").forEach(d=>{const hit=(!q||d.textContent.toLowerCase().includes(q))&&(!st||d.dataset.st===st);d.style.display=hit?"":"none";if(active&&hit)d.open=true;});document.querySelectorAll("section.sec").forEach(s=>{if(!active){s.style.display="";return;}const hasVisible=[...s.querySelectorAll("details.blk")].some(d=>d.style.display!=="none");s.style.display=hasVisible?"block":"none";s.classList.remove("collapsed");});};
  const input=document.getElementById("q");if(input)input.addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();apply();});
  const tg=document.getElementById("toggleAll");if(tg)tg.addEventListener("click",()=>{const cur=document.querySelectorAll("section.sec:not([style*='display: none']) details.blk");const anyClosed=[...cur].some(d=>!d.open);cur.forEach(d=>d.open=anyClosed);});
}
function initMotion(){
  const bar=document.getElementById("prog");let tick=false;addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{const h=document.documentElement.scrollHeight-innerHeight;bar.style.transform=`scaleX(${h>0?scrollY/h:0})`;tick=false;});},{passive:true});
}
function renderApp(){
  renderHeader();renderHero();
  document.getElementById("nav").innerHTML=HANDBOOK_SECTIONS.map(s=>`<a data-id="${s.id}">${s.number} ${esc(s.nav)}</a>`).join("");
  document.getElementById("app").innerHTML=render();
  initTabs();initSearch();initMotion();
  document.getElementById("btnPdf")?.addEventListener("click",()=>{document.querySelectorAll("details.blk").forEach(d=>d.open=true);document.querySelectorAll(".sec").forEach(s=>s.classList.remove("collapsed"));print();});
  const b=document.getElementById("toTop");addEventListener("scroll",()=>{b.style.display=scrollY>400?"block":"none"},{passive:true});b.addEventListener("click",()=>scrollTo(0,0));
  document.addEventListener("click",e=>{const m=e.target.closest(".mchip"),c=e.target.closest(".cpick");if(m){document.querySelectorAll(".mchip").forEach(x=>x.classList.toggle("on",x===m));document.getElementById("mwrap").innerHTML=monthHTML(+m.dataset.m);}if(c){document.querySelectorAll(".cpick").forEach(x=>x.classList.toggle("on",x===c));applyCompany(+c.dataset.c);}if(e.target.id==="decPdf"){document.body.classList.add("print-dec");document.querySelectorAll("#s07 details").forEach(d=>d.open=true);print();}});
  addEventListener("afterprint",()=>document.body.classList.remove("print-dec"));
  document.addEventListener("input",e=>{if(e.target.closest(".calc"))calcUpdate();const k=e.target.dataset.k;if(k===undefined)return;const st=decState[k]=decState[k]||{};const f=e.target.dataset.f;st[f]=f==="done"?e.target.checked:e.target.value;if(f==="done"){e.target.closest("tr").classList.toggle("done",e.target.checked);decCount();}try{localStorage.setItem(decKey,JSON.stringify(decState));}catch(x){}});
  if(document.getElementById("cLv"))calcUpdate();decCount();
  DEBUG_CONFIG.log("V9.7 FULL done");
}
ASSEMBLY.renderApp=renderApp;
document.addEventListener("DOMContentLoaded",renderApp);
</script>
