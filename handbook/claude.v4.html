 {title:"Nội quy văn phòng Engage⁺", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf — 5 slide Nội quy", blocks:[{type:"text", text:"Trong thời gian làm việc:"},L(["Nói chuyện điện thoại trong VP với âm lượng vừa phải; bàn công việc thì vào phòng họp chung.","Giờ nghỉ trưa: tôn trọng, giữ trật tự, tránh cười nói lớn tiếng.","Giữ vệ sinh nơi làm việc cá nhân và chỗ dùng chung.","Tắt điện, điều hoà, đóng cửa nếu là người ra về cuối cùng.","Ăn uống giữ vệ sinh sạch sẽ.","Không tự ý sử dụng đồ dùng cá nhân của người khác.","Đồ dùng chung lấy xong để lại đúng vị trí gọn gàng; không bày bừa trên bàn trống, khu vực chung, chỗ người khác.","Có ý thức sử dụng tiết kiệm và bảo vệ tài sản chung.","Các bạn nam hỗ trợ bưng nước theo lịch dán trên bình nước chung.","Nếu hút thuốc, ra ngoài lối thoát hiểm, không vứt tàn thuốc lung tung."]),{type:"text", text:"Môi trường làm việc, vui lòng:"},L(["Hạn chế nói tục, chửi thề trong VP.","Hạn chế đem thức ăn, đồ uống nặng mùi vào VP (nước mắm, mít, sầu riêng, mắm ruốc, mắm tôm…).","Không để bánh trái, đồ ăn vặt lung tung; cất tủ đóng gói cẩn thận; trước khi ra về sắp xếp nơi làm việc cá nhân.","Không nói chuyện riêng, trao đổi lớn tiếng, bật nhạc to trong VP.","Không để rác rơi vãi; bỏ rác đúng nơi quy định."]),{type:"text", text:"Phòng họp sau khi sử dụng:"},L(["Xếp lại bàn ghế trật tự, gọn gàng.","Tắt đèn, máy lạnh.","Hạn chế ăn uống thức ăn nặng mùi; nếu có thì xịt phòng xử lý tạm.","Tránh trao đổi lớn tiếng ảnh hưởng mọi người trong VP.","Không để bánh trái, đồ ăn vặt trong phòng.","Tài liệu, vật dụng cá nhân đem ra ngoài."]),{type:"text", text:"WC khi sử dụng:"},L(["Để rác đúng nơi quy định.","Không hút thuốc.","Không xịt nước ra sàn, thành bồn cầu.","Đổ cặn xác thức ăn, đồ uống vào thùng rác, không đổ vào bồn rửa tay.","Chén bát, đồ nấu ăn rửa sạch, lau khô, cất lại tủ gọn gàng; không bày bừa trên bàn rửa tay, trong WC."])]},
 {title:"VPP & đồ dùng văn phòng (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Đồ dùng VPP cố định (bấm giấy, thước, kéo, dao rọc giấy…): chỉ giao 1 lần/1 cái/1 người.","Lấy VPP & đồ dùng VPP: liên hệ HCNS; cần VPP khác: đăng ký HCNS duyệt mua.","Đồ dùng cá nhân sắp xếp cất giữ ở chỗ ngồi.","Đồ dùng, vật dụng, hàng hóa chương trình của team nào để ở kho; nếu để ở VP thì để chỗ của team mình.","In ấn: giữ vệ sinh nơi bàn in; không để giấy in sai lung tung; dùng giấy in tiết kiệm; hóa đơn, giấy tờ thanh toán, giải chi, tài liệu xem cá nhân/nháp cố gắng dùng giấy 1 mặt."])]},
 {title:"Bảo mật thông tin (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Mọi thông tin về lương thưởng phải được bảo mật, không chia sẻ cho người khác.","Chứng từ hóa đơn, báo giá, hợp đồng, CE-CO không để lung tung; in sai hoặc không dùng tới có thể giữ làm giấy nháp cho riêng mình; nếu làm giấy 1 mặt thì phải gạch bỏ mặt còn lại."])]},
 {title:"Hành chính nội bộ — chăm sóc văn phòng & 5S", status:"DRAFT", src:"TGROUP_CHÍNH_SÁCH_CHUNG.xlsx — sheet “Hành chính nội bộ” (cột HIỆN TRẠNG để trống)", blocks:[{type:"text", text:"1. Không gian làm việc"}, L(["Kiểm tra vệ sinh toàn bộ văn phòng trước giờ làm.","Kiểm tra Pantry, phòng họp, khu tiếp khách.","Kiểm tra nhà vệ sinh sạch sẽ, đủ giấy, xà phòng, nước rửa tay.","Kiểm tra điều hòa, đèn, máy lọc nước.","Sắp xếp bàn ghế ngay ngắn sau mỗi cuộc họp.","Kiểm tra cây xanh, tưới nước.","Loại bỏ đồ vật hư hỏng hoặc không còn sử dụng.","Đảm bảo lối đi thông thoáng, an toàn."]),{type:"text", text:"2. Pantry & đồ dùng"}, L(["Chuẩn bị trà, cà phê, nước uống.","Bổ sung bánh/snack nếu công ty có chính sách.","Kiểm tra hạn sử dụng thực phẩm; tủ lạnh sạch sẽ.","Sắp xếp ly, chén, muỗng đúng vị trí.","Quản lý kho văn phòng phẩm; bổ sung giấy in, bút, sổ tay."]),{type:"text", text:"3. Truyền cảm hứng"}, L(["Cập nhật bảng tin nội bộ.","Trang trí văn phòng theo mùa."]),{type:"text", text:"4. Quản lý tài sản"}, L(["Theo dõi bàn ghế hư hỏng, sửa chữa.","Theo dõi máy in: bảo trì, mực in.","Theo dõi máy lạnh: bảo trì, sửa chữa.","Theo dõi thiết bị các phòng họp.","Báo sửa chữa kịp thời khi phát hiện hỏng hóc."]),{type:"text", text:"5. Chăm sóc tinh thần nhân viên"}, L(["Thiệp sinh nhật từng cá nhân; thiệp chúc mừng kết hôn; thiệp chúc mừng sinh con; thăm hỏi ốm đau."]),{type:"text", text:"Tiêu chuẩn 5S văn phòng"}, L(["Sàng lọc: loại bỏ vật dụng không cần thiết.","Sắp xếp: đồ dùng có vị trí rõ ràng, dễ tìm.","Sạch sẽ: duy trì vệ sinh hằng ngày.","Săn sóc: kiểm tra định kỳ, nhắc nhở và cải tiến.","Sẵn sàng: hình thành thói quen giữ gìn không gian chung.","Tổ chức chấm điểm 5S theo từng khu vực hoặc phòng ban."]),T(["Tần suất","Công việc định kỳ"],[["Hằng ngày","Kiểm tra vệ sinh và Pantry; kiểm tra phòng họp trước/sau khi sử dụng; bổ sung VPP; kiểm tra thiết bị; chăm sóc cây cảnh; tiếp nhận và xử lý phản ánh của nhân viên kịp thời"],["Hằng tuần","Tổng vệ sinh khu vực chung; kiểm kê VPP; trang trí hoa/cây xanh; tổ chức một hoạt động gắn kết ngắn; kiểm tra tài sản và thiết bị"],["Hằng tháng","Đánh giá mức độ hài lòng của nhân viên; đề xuất cải thiện không gian làm việc; thay đổi góc trang trí theo chủ đề; báo cáo chi phí hành chính và kế hoạch tháng tiếp theo"]]),{type:"note", text:"Dự trù ngân sách tổng của bộ phận Hành chính: "+NA}]},

 {title:"Nghỉ bù (ePlus)", status:"DRAFT", src:"EPLUS_QUY_ĐỊNH_CHUNG (cũ).pdf", blocks:[L(["Event cuối tuần: nghỉ bù ½ ngày cho 1 ngày chạy event cuối tuần, trong ngày làm việc của tuần tiếp theo.","Không quy đổi ngày nghỉ bù event thành ngày phép và cộng dồn.","Ngày nghỉ bù linh động theo từng thành viên ở tuần tiếp theo để đảm bảo report kịp thời cho khách hàng.","Quay/shoot cuối tuần: tùy tính chất/độ phức tạp dự án, leader quyết định nghỉ bù hoặc chỉ được đi làm trễ ngày hôm sau.","Nghỉ bệnh phải có giấy xác nhận của bệnh viện/bác sĩ và được duyệt theo quy định luật lao động.","Tùy workload chung, Leader duyệt khoảng thời gian nghỉ phép cho từng thành viên."])]},
 {title:"Nghỉ đột xuất, thông báo ra ngoài (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Nghỉ đột xuất: gọi điện, nhắn tin cho Leader và HR; bổ sung đơn nghỉ phép sau.","Lý do cá nhân vào công ty sau 10h → nghỉ nửa ngày; về trước 15h → nghỉ nửa ngày.","Thông báo lý do ra ngoài trong giờ hành chính với cấp trên.","Nghỉ các ngày lễ theo quy định Nhà nước và quyết định của công ty."])]},
 {title:"Hợp đồng lao động & trả lương (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Ký HĐLĐ chính thức sau 2–3 tháng thử việc (nếu đạt yêu cầu).","Công ty có quyền đơn phương chấm dứt HĐLĐ nếu nhân viên tự ý bỏ việc hoặc thường xuyên không hoàn thành nhiệm vụ. Báo trước 30 ngày (HĐLĐ 1–3 năm) hoặc 07 ngày (HĐLĐ 3 tháng–1 năm).","Người lao động có quyền đơn phương chấm dứt HĐLĐ; thông báo bằng văn bản đến HR ít nhất 30 ngày.","Trả lương: chuyển khoản VND qua tài khoản ngân hàng HDBank; từ ngày 01 đến ngày 10 của tháng kế tiếp."]),{type:"note", text:"ePlus: thử việc, HĐLĐ, trả lương — "+NA}]},
 {title:"Chấm công (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[{type:"text", text:"Hình thức: dùng dấu vân tay mở cửa để check in/check out."},T(["Nhân viên","Leader","HR/Admin"],[["Chấm công → Kiểm tra → Giải trình nếu sai","Xác nhận giải trình → Xác nhận OT/Công tác","Tổng hợp → Đối chiếu → Điều chỉnh → Chốt công → Chuyển Payroll"]])]},
 {title:"Career Path (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf — slide Career Path", blocks:[T(["Nhóm cấp","Level","Thời gian"],[["Executive","I/E1, E2","1–2 năm"],["Senior Executive","E3/S1, S2","1–2 năm"],["Manager","S3/M1, M2","1–3 năm"],["BUD/D","M3/D1, D2",NA],["MD","—",NA]]),T(["Yêu cầu","Mô tả"],[["Assignment","Hoàn thành tốt công việc trong vị trí được yêu cầu"],["Experience","Hoàn thiện kỹ năng, cải tiến khả năng hoàn thành công việc xuất sắc"],["Management","Hoàn thiện kỹ năng quản lý trong yêu cầu công việc và trong team"],["Leadership","Xây dựng được team lớn mạnh, tạo điều kiện để các thành viên phát triển"],["Revenue","Chịu trách nhiệm về doanh số công ty"],["Strategy","Phát triển tầm nhìn chiến lược, định hướng cụ thể cho team, đóng góp hướng phát triển cho công ty"],["Administration","Hoàn thiện kỹ năng quản trị bao quát các cross function"],["Credibility","Có được sự tín nhiệm từ các cross function"],["Sustainability","Xây dựng, giữ gìn, cải tiến tầm nhìn công ty hướng đến sự phát triển bền vững"]]),{type:"note", text:"Bảng nguồn thêm yêu cầu theo level (E1 Assignment; E2 +Experience; S1 +Management; S2 +Leadership; M1 +Revenue; M2 +Strategy; D1 +Administration; D2 +Credibility; MD Sustainability). ePlus: "+NA}]}
]},

 {title:"Quyền lợi nhân viên (Engage⁺)", status:"DRAFT", src:"CHINH_SACH_ENGAGE_PLUS (cũ).pdf", blocks:[L(["Bonus: thưởng theo KPI cuối năm.","Tham gia các hoạt động chung của Tgroup và của công ty.","Du lịch nước ngoài, company trip giữa năm tùy tình hình kinh doanh thực tế.","Hỗ trợ tham gia các khóa học nâng cao kỹ năng phù hợp với cá nhân và công việc.","Sinh nhật nhân viên hàng tháng (1 tháng/1 lần cho nhân viên sinh nhật cùng tháng): Quản lý 500.000đ/người; Nhân viên 300.000đ/người."])]},

const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const badge = st => `<span class="st ${st}">${STATUS_LABEL[st]||st}</span>`;
function renderOrgMap(){
  const d = ORG_DATA;
  const team = t => `<div class="team"><b class="line-clamp-2 break-words">${esc(t[0])}</b>${t[1]?`<span>${esc(t[1])}</span>`:""}${t[2]?`<em>${esc(t[2])}</em>`:""}</div>`;
  const card = c => `<div class="orgcard"><h5 class="break-words">${esc(c.title||c.name)}</h5>${c.lead?`<p class="lead2 break-words">${esc(c.lead)}</p>`:""}${c.teams.map(team).join("")}</div>`;
  const cluster = k => `<div class="cl"><h4 class="break-words">${esc(k.title)}</h4><p class="break-words">${esc(k.note)}</p><div class="grid2">${k.companies.map(card).join("")}</div></div>`;
  return `<div class="orgmap">
    <div class="orgcard top"><h4>${esc(d.top.title)}</h4><div class="two"><div><span>Chủ tịch HĐQT</span>${esc(d.top.chair)}</div><div><span>Ban Điều hành</span>${esc(d.top.board)}</div></div></div>
    <div class="conn"></div>
    <div class="band"><span class="bl">KHỐI HỖ TRỢ & PHÁT TRIỂN</span><div class="grid2">${d.support.map(card).join("")}</div></div>
    <div class="conn"></div>
    <div class="band"><span class="bl">KHỐI VẬN HÀNH KINH DOANH</span>${d.clusters.map(cluster).join("")}</div>
  </div>`;
}
const vnd = n => n.toLocaleString("vi-VN")+"đ";
function monthHTML(m){
  const sp = (MONTH_SPECIAL[m]||[]).map(x=>`<li class="break-words">${esc(x)}</li>`).join("");
  const bd = BIRTHDAYS.filter(b=>b.month===m).map(b=>`${esc(b.name)} (${b.day}/${m})`).join(", ");
  return `<div class="mpanel"><h4>Tháng ${m}</h4><ul><li><b>Hằng tuần:</b> Happy Friday — bữa ăn xế 16:00 chiều thứ 6 (50k/người/tuần theo Excel); Thank You Wall</li><li><b>Hằng tháng:</b> chúc mừng sinh nhật ngày 10 (QL 500k, NV 300k, bánh kem 500k/tháng)</li><li><b>Theo quý:</b> Innovation Day</li>${sp}</ul><div class="note"><b>Sinh nhật:</b> ${bd || "danh sách ngày sinh "+NA}</div></div>`;
}
function renderCalendar(){
  const cur = new Date().getMonth()+1;
  const chips = Array.from({length:12},(_,i)=>i+1).map(m=>`<button class="mchip${MONTH_SPECIAL[m]?" sp":""}${m===cur?" on":""}" data-m="${m}">T${m}</button>`).join("");
  return `<div class="tl" id="tl">${chips}</div><div id="mwrap">${monthHTML(cur)}</div>`;
}
function renderCompanyPick(){
  const n = ["Tất cả","Engage","ePlus","Enabler","The Wall","Bức Tường","Green Wall","Nguyễn Mộc"];
  return `<div>${n.map((x,i)=>`<button class="cpick${i===0?" on":""}" data-c="${i}">${x}</button>`).join("")}</div>`;
}
function applyCompany(idx){
  document.querySelectorAll("#s04 table").forEach(t=>{
    const th = t.querySelectorAll("thead th"); if(th.length!==8 || th[1].textContent!=="Engage") return;
    t.style.minWidth = idx ? "0" : "";
    t.querySelectorAll("tr").forEach(tr=>[...tr.children].forEach((c,j)=>{ c.style.display = (!idx||j===0||j===idx) ? "" : "none"; }));
  });
}
function renderCalc(){
  const o = CALC_RATES.levels.map((l,i)=>`<option value="${i}">${esc(l[0])}</option>`).join("");
  return `<div class="calc"><div><label>Cấp bậc</label><select id="cLv">${o}</select></div><div><label>Số ngày công tác</label><input id="cDay" type="number" min="0" value="2"></div><div><label>Số đêm khách sạn</label><input id="cNight" type="number" min="0" value="1"></div><div><label>Hỗ trợ ra ga/sân bay</label><select id="cAir"><option value="0">Không</option><option value="1">1 chiều</option><option value="2">Khứ hồi</option></select></div></div><div class="res" id="cRes"></div><div class="note">Mức tối đa theo thực tế. Nhân viên dùng app xe công nghệ của công ty không được hỗ trợ khoản ra ga/sân bay (ePlus).</div>`;
}
function calcUpdate(){
  const l = CALC_RATES.levels[+document.getElementById("cLv").value];
  const d = Math.max(0,+document.getElementById("cDay").value||0), n = Math.max(0,+document.getElementById("cNight").value||0), a = +document.getElementById("cAir").value;
  const f=l[1]*d, h=l[2]*n, ap=CALC_RATES.airport*a;
  const el=document.getElementById("cRes"); if(el) el.innerHTML = `Ăn uống: <b>${vnd(f)}</b> · Khách sạn: <b>${vnd(h)}</b> · Sân bay: <b>${vnd(ap)}</b><br>Tổng tối đa: <span class="big">${vnd(f+h+ap)}</span>`;
}
const decKey = "hb_decisions"; let decState = {}; try{ decState = JSON.parse(localStorage.getItem(decKey)||"{}"); }catch(e){}
function renderDecisions(){
  const rows = ALIGNMENT_DATA.map((a,i)=>[a,i]).filter(([a])=>a[5]==="NEEDS_ALIGNMENT"||a[5]==="PROPOSED");
  const r = rows.map(([a,i],k)=>{ const st = decState[i]||{};
    return `<tr class="${st.done?"done":""}"><td>${k+1}</td><td><b class="break-words">${esc(a[0])}</b><br><span class="line-clamp-2">${esc(a[4])}</span></td><td class="line-clamp-3 break-words">${esc(ALIGNMENT_REASON[i])}</td><td><input type="text" data-k="${i}" data-f="who" value="${esc(st.who||"BOD")}"></td><td><input type="date" data-k="${i}" data-f="date" value="${st.date||""}"></td><td style="text-align:center"><input type="checkbox" data-k="${i}" data-f="done"${st.done?" checked":""}></td></tr>`; }).join("");
  return `<p><b id="decCount"></b> <button class="btn" id="decPdf" style="color:var(--brand);border-color:var(--brand)">Xuất PDF gửi họp</button></p><div class="tw dec"><table><thead><tr><th>#</th><th>Nội dung cần quyết</th><th>Lý do</th><th>Người quyết</th><th>Hạn chót</th><th>Đã chốt</th></tr></thead><tbody>${r}</tbody></table></div>`;
}
function decCount(){ const t = document.querySelectorAll("#s07 input[type=checkbox]"); const el = document.getElementById("decCount"); if(el) el.textContent = `${[...t].filter(c=>c.checked).length}/${t.length} mục đã chốt`; }
function renderBlock(b){
  if(b.type==="list") return `<ul>${b.items.map(i=>`<li class="break-words">${esc(i)}</li>`).join("")}</ul>`;
  if(b.type==="text") return `<p class="break-words">${esc(b.text)}</p>`;
  if(b.type==="note") return `<div class="note break-words">${esc(b.text)}</div>`;
  if(b.type==="orgmap") return renderOrgMap();
  if(b.type==="calendar") return renderCalendar();
  if(b.type==="companypick") return renderCompanyPick();
  if(b.type==="calc") return renderCalc();
  if(b.type==="decisions") return renderDecisions();
  if(b.type==="org") return `<div class="org">${b.boxes.map(x=>`<div class="box"><b class="break-words">${esc(x[0])}</b><br><span class="break-words">${esc(x[1])}</span></div>`).join("")}</div>`;
  if(b.type==="table"){
    const h = b.head.map(x=>`<th>${esc(x)}</th>`).join("");
    const r = b.rows.map(row=>`<tr>${row.map(c=>`<td class="break-words">${esc(c)}</td>`).join("")}</tr>`).join("");
    return `<div class="tw"><table><thead><tr>${h}</tr></thead><tbody>${r}</tbody></table></div>`;
  }
  if(b.type==="align"){
    const r = b.ids.map(i=>{const a=ALIGNMENT_DATA[i];
      return `<tr><td><b class="break-words">${esc(a[0])}</b></td><td class="break-words">${esc(a[1])}</td><td class="break-words">${esc(a[2])}</td><td class="break-words">${esc(a[3])}</td><td class="break-words line-clamp-3">${esc(a[4])}</td><td class="break-words line-clamp-3">${esc(ALIGNMENT_REASON[i])}</td><td>${badge(a[5])}</td></tr>`}).join("");
    return `<div class="tw"><table><thead><tr><th>Nội dung</th><th>Engage</th><th>ePlus</th><th>HR / Excel</th><th>Khác biệt</th><th>Lý do</th><th>Trạng thái</th></tr></thead><tbody>${r}</tbody></table></div>`;
  }
  return "";
}

// 🧱 RÁP: ASSEMBLY {order [Header, Hero, Footer]} + renderApp()
function renderHeader(){
  const M = HANDBOOK_META;
  const imgFallback = `this.onerror=null;this.src='${CONFIG.hero.imageFallback}'`;
  // MUST use THEME[CONFIG.style], MUST alt + onerror fallback + lazy
  document.getElementById("header").innerHTML = `
    <span class="logo" id="logo">
      <span class="plate"><img src="${M.tgroupLogo}" alt="${CONFIG.header.imageAlt}" loading="lazy" onerror="${imgFallback}"></span>
      <img class="lw" src="${M.logoWhite}" alt="${CONFIG.header.imageAlt}" loading="lazy" onerror="${imgFallback}">
      <img class="lb" src="${M.logoBlack}" alt="${CONFIG.header.imageAlt}" loading="lazy" onerror="${imgFallback}">
    </span>
    <span class="sub">${esc(M.header)}</span>
    <span class="pill">${esc(M.status)}</span>
    <button class="btn" id="btnPdf">Download PDF</button>`;
  document.getElementById("foot").textContent = M.footer;
  document.title = M.title;
}
function renderHero(){
  const h = document.getElementById("hero"), C = CONFIG.hero, M = HANDBOOK_META;
  const fb = `this.onerror=null;this.src='${C.imageFallback}'`;
  h.innerHTML = `<div class="hero-in">
    <div class="plate"><img src="${M.tgroupLogo}" alt="${C.imageAlt}" loading="lazy" onerror="${fb}"></div>
    <div class="hero-line"></div>
    <img class="hero-w" src="${C.image}" alt="${C.imageAlt}" loading="lazy" onerror="${fb}">
    <h2 class="hero-title break-words">${esc(C.title)}</h2>
    <div class="hero-sub break-words">${esc(C.desc)}</div>
    <button class="hero-btn" id="enter">${esc(C.cta)}</button>
  </div>`;
  let seen = false; try{ seen = sessionStorage.getItem("hb_seen")==="1"; }catch(e){}
  const close = () => { h.classList.add("out"); document.body.classList.remove("lock"); try{ sessionStorage.setItem("hb_seen","1"); }catch(e){} setTimeout(()=>h.remove(),800); };
  if(seen){ h.remove(); return; }
  document.body.classList.add("lock");
  document.getElementById("enter").addEventListener("click", close);
}
function renderNav(){
  document.getElementById("nav").innerHTML = HANDBOOK_SECTIONS.map(s=>`<a data-id="${s.id}">${s.number} ${esc(s.nav)}</a>`).join("");
}
function render(){
  // MUST break-words + line-clamp applied in blocks above
  const cnt = {}; HANDBOOK_SECTIONS.forEach(x=>x.subsections.forEach(y=>cnt[y.status]=(cnt[y.status]||0)+1));
  const legend = `<div class="legend">${Object.keys(STATUS_LABEL).filter(k=>cnt[k]).map(k=>`<button class="st lg ${k}" data-st="${k}">${STATUS_LABEL[k]} · ${cnt[k]}</button>`).join("")}</div>`;
  const secs = HANDBOOK_SECTIONS.map(s=>`
    <section class="sec" id="${s.id}">
      <h2><span class="num">${s.number}</span><span class="break-words">${esc(s.title)}</span> ${badge(s.status)}</h2>
      ${s.subsections.map((sub,k)=>`
        <details class="blk" data-st="${sub.status}"${(k===0||sub.open)?" open":""}>
          <summary><span class="break-words">${esc(sub.title)}</span> ${badge(sub.status)}</summary>
          <div class="body"><p class="src break-words">Nguồn: ${esc(sub.src)}</p>${sub.blocks.map(renderBlock).join("")}</div>
        </details>`).join("")}
    </section>`).join("");
  document.getElementById("app").innerHTML = `
    <h1 class="break-words">${esc(HANDBOOK_META.title)}</h1><p class="lead break-words">${esc(HANDBOOK_META.subtitle)}</p>
    <div class="tools"><input class="search" id="q" placeholder="Tìm kiếm trong Handbook…"><button id="toggleAll">Mở / đóng tất cả</button></div>${legend}${secs}`;
}
const ASSEMBLY = { order:["Header","Hero","Nav","Content","Footer"], renderApp: null };
function initTabs(){
  const links = [...document.querySelectorAll("#nav a")], secs = [...document.querySelectorAll("section.sec")];
  const show = id => { links.forEach(a=>a.classList.toggle("on", a.dataset.id===id)); secs.forEach(x=>x.classList.toggle("on", x.id===id)); };
  links.forEach(a=>a.addEventListener("click", ()=>{ show(a.dataset.id); window.scrollTo(0, document.getElementById("app").offsetTop - 8); }));
  if(links[0]) show(HANDBOOK_SECTIONS[0].id);
}
function initSearch(){
  let q = "", st = "";
  const apply = () => {
    const active = !!(q || st);
    document.body.classList.toggle("searching", active);
    document.querySelectorAll("details.blk").forEach(d=>{
      const hit = (!q || d.textContent.toLowerCase().includes(q)) && (!st || d.dataset.st===st);
      d.style.display = hit ? "" : "none"; if(active && hit) d.open = true;
    });
  };
  const input=document.getElementById("q"); if(input) input.addEventListener("input", e=>{ q = e.target.value.trim().toLowerCase(); apply(); });
  document.querySelectorAll(".lg").forEach(b=>b.addEventListener("click", ()=>{
    st = (st===b.dataset.st) ? "" : b.dataset.st;
    document.querySelectorAll(".lg").forEach(x=>x.classList.toggle("on", x.dataset.st===st)); apply();
  }));
  const tg=document.getElementById("toggleAll"); if(tg) tg.addEventListener("click", ()=>{
    const cur = document.querySelectorAll("section.sec.on details.blk");
    const anyClosed = [...cur].some(d=>!d.open); cur.forEach(d=>d.open = anyClosed);
  });
}
function initMotion(){
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); } }), {threshold:.08});
  document.querySelectorAll("details.blk, .orgcard, .cl, .band").forEach((el,i)=>{ el.classList.add("rv"); el.style.transitionDelay = (i%4)*70+"ms"; io.observe(el); });
  const bar = document.getElementById("prog"); let tick = false;
  window.addEventListener("scroll", ()=>{ if(tick) return; tick = true; requestAnimationFrame(()=>{
    const h = document.documentElement.scrollHeight - innerHeight; bar.style.transform = `scaleX(${h>0 ? scrollY/h : 0})`; tick = false; }); }, {passive:true});
}
function initPdf(){
  const btn=document.getElementById("btnPdf"); if(btn) btn.addEventListener("click", ()=>{
    document.querySelectorAll("details.blk").forEach(d=>d.open = true);
    window.print();
  });
}
function initBackToTop(){
  const b = document.getElementById("toTop"); let on = false;
  window.addEventListener("scroll", ()=>{ const v = window.scrollY>500; if(v!==on){ on=v; b.style.display = v ? "block" : "none"; } }, {passive:true});
  b.addEventListener("click", ()=>window.scrollTo(0,0));
}
function initTools(){
  document.addEventListener("click", e=>{
    const m = e.target.closest(".mchip"), c = e.target.closest(".cpick");
    if(m){ document.querySelectorAll(".mchip").forEach(x=>x.classList.toggle("on",x===m)); document.getElementById("mwrap").innerHTML = monthHTML(+m.dataset.m); }
    if(c){ document.querySelectorAll(".cpick").forEach(x=>x.classList.toggle("on",x===c)); applyCompany(+c.dataset.c); }
    if(e.target.id==="decPdf"){ document.body.classList.add("print-dec"); document.querySelectorAll("#s07 details").forEach(d=>d.open=true); window.print(); }
  });
  window.addEventListener("afterprint", ()=>document.body.classList.remove("print-dec"));
  document.addEventListener("input", e=>{
    if(e.target.closest(".calc")) calcUpdate();
    const k = e.target.dataset.k; if(k===undefined) return;
    const st = decState[k] = decState[k]||{}; const f = e.target.dataset.f;
    st[f] = f==="done" ? e.target.checked : e.target.value;
    if(f==="done"){ e.target.closest("tr").classList.toggle("done", e.target.checked); decCount(); }
    try{ localStorage.setItem(decKey, JSON.stringify(decState)); }catch(x){}
  });
  if(document.getElementById("cLv")) calcUpdate(); decCount();
}
function renderApp(){
  // 🏠 MÓNG: [PAGE_META + THEME_GLOBAL + DEBUG_CONFIG]
  // 📐 BẢN VẼ: [CONFIG]
  // 👷 THỢ XÂY: [render keep UI + fallback]
  // 🧱 RÁP: [ASSEMBLY order Header, Hero, Footer]
  // 🛡️ CHỐNG VỠ: [wrap + clamp]
  renderHeader();
  renderHero();
  renderNav();
  render();
  initTabs();
  initSearch();
  initPdf();
  initBackToTop();
  initMotion();
  initTools();
  DEBUG_CONFIG.log("renderApp done", PAGE_META.version);
}
ASSEMBLY.renderApp = renderApp;
document.addEventListener("DOMContentLoaded", renderApp);
</script>
